<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:type" content="website">
<meta property="og:title" content="핀볼 뽑기">
<meta property="og:description" content="이름을 넣고 구슬을 떨어뜨려 당첨자를 뽑는 핀볼 추첨 게임">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ff4d7a'/%3E%3Ccircle cx='12' cy='11' r='4.5' fill='%23ffffff' fill-opacity='.75'/%3E%3C/svg%3E">
<style>html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
<title>핀볼 뽑기</title>
<meta name="description" content="이름을 넣고 구슬을 떨어뜨리는 핀볼 추첨 게임">
<meta name="theme-color" content="#0c0a11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 화면 전체가 핀볼 플레이필드(캔버스). 위쪽 백박스에 도트 전광판, 설정은 에이프런 카드(폰: 아래 시트 / 넓은 화면: 왼쪽 카드),
   오른쪽에 코스 미니맵 레일, 레이스 중에는 아래쪽 조작 바. 오락실 캐비닛 하나의 세계로 일부러 다크 단일 테마. */
:root {
  color-scheme: dark;
  --cabinet: #0c0a11;      /* 캐비닛 */
  --field: #16121e;        /* 플레이필드 */
  --field-2: #1b1626;      /* 구역 띠 */
  --chrome: #d6dbe6;       /* 크롬 레일 */
  --chrome-dark: #6e7688;
  --dmd: #ff922e;          /* 도트 전광판 앰버 */
  --dmd-off: #2a190b;
  --dmd-bg: #0b0705;
  --insert: #ff4d7a;       /* 램프 인서트 */
  --insert-hi: #ff9bb4;
  --insert-lo: #b3163e;
  --brass: #e6b85c;        /* 핀 */
  --ramp: #3cc8b4;         /* 지그재그 경사로 */
  --spinner: #6b8cff;      /* 풍차 */
  --fur: #f2a35e;          /* 고양이 손 */
  --fur-dark: #b0642a;
  --bean: #ff9fb4;
  --ink: #f3eee6;
  --muted: #a39bb2;
  --panel: #1a1623;
  --panel-2: #251f31;
  --line: #372e45;
  --scrim: rgba(8, 6, 12, 0.58);
  --glass: rgba(26, 22, 35, 0.88);
  --danger: #ff9a8a;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--cabinet); color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  word-break: keep-all; overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#field.is-dragging { cursor: grabbing; }

:where(button, input, textarea, summary):focus-visible { outline: 2px solid var(--dmd); outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* 백박스 (도트 전광판) */
.backbox {
  position: absolute; z-index: 4; top: 10px; left: 16px; right: 16px;
  margin-inline: auto; max-width: 560px; padding: 5px;
  border-radius: 12px; border: 1px solid var(--line);
  background: linear-gradient(180deg, var(--panel-2), var(--cabinet));
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
#dmd { display: block; width: 100%; height: 52px; border-radius: 7px; background: var(--dmd-bg); }
.wide .backbox { right: auto; margin: 0; }
.wide #dmd { height: 62px; }

#mini { position: absolute; z-index: 2; border-radius: 8px; touch-action: none; cursor: pointer; }

/* 설정 에이프런 */
.apron {
  position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; margin-inline: auto;
  max-width: 600px; max-height: 72%; overflow-y: auto; box-sizing: border-box;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 16px 16px 18px;
  background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 20px 20px 0 0; box-shadow: 0 -18px 40px rgba(0, 0, 0, 0.5);
}
.wide .apron {
  left: 20px; right: auto; top: 20px; bottom: auto; width: 300px; max-height: calc(100% - 40px);
  border-radius: 18px; border-bottom: 1px solid var(--line); padding: 20px 18px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
}
.apron h1 {
  margin: 0; display: flex; align-items: center; gap: 10px;
  font: 400 26px/1.1 var(--font-display); letter-spacing: 0.01em; text-wrap: balance;
}
.apron h1::before {
  content: ""; flex: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--insert); box-shadow: 0 0 12px var(--insert);
}
.lede { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; text-wrap: pretty; }
.label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.label-row label, legend {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted);
}
.sample { font-size: 12px; color: var(--dmd); }
textarea {
  display: block; width: 100%; box-sizing: border-box; resize: vertical;
  min-height: 84px; max-height: 40vh; padding: 10px 12px;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--cabinet); color: var(--ink); font: 500 15px/1.55 var(--font-body);
  word-break: keep-all;
}
textarea:focus-visible { outline-offset: 0; }
.hint { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.hint code {
  font-family: var(--font-mono); font-size: 12px; color: var(--ink);
  background: var(--panel-2); padding: 1px 6px; border-radius: 6px;
}
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; }
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px;
  border-radius: 14px; background: var(--cabinet); border: 1px solid var(--line);
}
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  text-align: center; padding: 9px 4px; border-radius: 10px; cursor: pointer;
  font-weight: 600; font-size: 14px; color: var(--muted); user-select: none; touch-action: manipulation;
}
.seg input:checked + label { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.seg input:focus-visible + label { outline: 2px solid var(--dmd); outline-offset: 1px; }
.rank-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted); }
.rank-row input {
  width: 76px; box-sizing: border-box; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--cabinet); color: var(--ink);
  font: 600 15px var(--font-mono);
}
.toggle { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle b { color: var(--ink); font-weight: 600; margin-right: 4px; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle .track {
  flex: none; position: relative; width: 38px; height: 22px; border-radius: 999px;
  background: var(--cabinet); border: 1px solid var(--line); transition: background 0.15s;
}
.toggle .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--muted); transition: transform 0.15s, background 0.15s;
}
.toggle input:checked + .track { background: rgba(255, 146, 46, 0.25); border-color: rgba(255, 146, 46, 0.6); }
.toggle input:checked + .track::after { transform: translateX(16px); background: var(--dmd); }
.toggle input:focus-visible + .track { outline: 2px solid var(--dmd); outline-offset: 2px; }
.foot { display: flex; align-items: center; gap: 12px; }
.wide .foot { flex-direction: column; align-items: stretch; gap: 10px; }
.wide .foot .btn-start { width: 100%; }
.summary { margin: 0; flex: 1; min-width: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); font-weight: 600; }
.error { margin: -4px 0 0; font-size: 13px; color: var(--danger); }
.fair { margin: 0; font-size: 12px; color: var(--muted); }

.btn-start {
  appearance: none; border: 0; cursor: pointer; touch-action: manipulation;
  min-width: 124px; padding: 14px 22px; border-radius: 999px;
  font: 400 19px/1 var(--font-display); letter-spacing: 0.06em; color: var(--ink);
  background: radial-gradient(120% 150% at 50% 0%, var(--insert-hi) 0%, var(--insert) 45%, var(--insert-lo) 100%);
  box-shadow: 0 0 0 3px rgba(255, 77, 122, 0.16), 0 8px 24px rgba(255, 77, 122, 0.32),
    inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.25);
  transition: transform 0.12s, filter 0.12s;
}
.btn-start:hover { filter: brightness(1.08); }
.btn-start:active { transform: translateY(1px) scale(0.98); }
.btn-start:disabled { cursor: not-allowed; filter: grayscale(0.85) brightness(0.6); box-shadow: none; }

.btn {
  appearance: none; cursor: pointer; touch-action: manipulation;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  border-radius: 12px; padding: 11px 12px; font: 600 14px var(--font-body);
}
.btn:hover { border-color: var(--muted); }

/* 레이스 조작 바 */
.controls {
  position: absolute; z-index: 4; left: 16px; right: 16px; bottom: 14px; margin-inline: auto;
  max-width: 440px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px;
  border-radius: 18px; background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.wide .controls { right: auto; margin: 0; width: 420px; transform: translateX(-50%); }
.ctl {
  appearance: none; position: relative; overflow: hidden; cursor: pointer; touch-action: manipulation;
  display: grid; justify-items: center; gap: 3px; padding: 8px 4px 7px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); color: var(--ink);
  font: 600 12px/1.2 var(--font-body);
}
.ctl svg { width: 20px; height: 20px; }
.ctl[aria-pressed="true"] { color: var(--dmd); border-color: rgba(255, 146, 46, 0.5); }
.ctl:disabled { cursor: default; opacity: 0.55; }
.ctl .cd { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--dmd); }

.follow {
  position: absolute; z-index: 4; left: 50%; transform: translateX(-50%);
  appearance: none; cursor: pointer; padding: 8px 14px; border-radius: 999px;
  border: 1px solid rgba(255, 146, 46, 0.5); background: var(--glass); color: var(--dmd);
  font: 600 13px var(--font-body); white-space: nowrap;
}

/* 넓은 화면: 실시간 순위 */
.board {
  position: absolute; z-index: 3; left: 20px; top: 20px; width: 300px; max-height: calc(100% - 40px);
  box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
  border-radius: 18px; border: 1px solid var(--line); background: var(--glass);
}
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 16px 16px 10px; }
.board-head h2 { margin: 0; font: 400 20px var(--font-display); }
.board-head span { font: 600 12.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.board-goal { margin: 0; padding: 0 16px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.board-goal b { color: var(--dmd); font-weight: 600; }
.board ol { list-style: none; margin: 0; padding: 6px 8px 10px; overflow-y: auto; min-height: 0; }
.row {
  display: grid; grid-template-columns: 28px 12px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 8px; font-size: 13.5px;
}
.row .rk { font: 600 12px var(--font-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tm { font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.done .rk, .row.done .nm { color: var(--ink); }
.row.racing .nm { color: var(--muted); }
.row.target { background: rgba(255, 146, 46, 0.12); box-shadow: inset 0 0 0 1px rgba(255, 146, 46, 0.45); }
.row.target .tm, .row.target .nm { color: var(--dmd); }
.row.won { background: rgba(255, 77, 122, 0.16); box-shadow: inset 0 0 0 1px rgba(255, 77, 122, 0.6); }
.row.won .tm { color: var(--insert); }

/* 폰: 최근 도착 */
.ticker { position: absolute; z-index: 3; left: 16px; margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; pointer-events: none; }
.ticker li {
  display: flex; align-items: center; gap: 6px; width: max-content; max-width: 58vw;
  padding: 3px 10px 3px 4px; border-radius: 999px; font-size: 12.5px;
  background: var(--glass); border: 1px solid var(--line);
}
.ticker .rk {
  min-width: 26px; box-sizing: border-box; padding: 1px 5px; border-radius: 999px; text-align: center;
  font: 600 11px var(--font-mono); background: var(--panel-2); font-variant-numeric: tabular-nums;
}
.ticker .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.ticker .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticker li.target { border-color: rgba(255, 146, 46, 0.6); }
.ticker li.target .rk { background: var(--dmd); color: var(--dmd-bg); }

/* 결과 */
.result { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.result-card {
  width: min(420px, 100%); max-height: calc(100% - 8px); overflow-y: auto; box-sizing: border-box;
  padding: 22px 20px 18px; border-radius: 22px; text-align: center;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1) both;
}
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--dmd); }
.result-name {
  margin: 10px 0 6px; display: flex; align-items: center; justify-content: center; gap: 12px;
  font: 400 clamp(34px, 11vw, 52px)/1.08 var(--font-display); overflow-wrap: anywhere; text-wrap: balance;
}
.result-name .ball {
  flex: none; width: 0.6em; height: 0.6em; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85), transparent 45%), var(--c);
  box-shadow: inset 0 -4px 6px rgba(0, 0, 0, 0.3);
}
.result-meta { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.result-actions .btn-start { grid-column: 1 / -1; }
.copy-fallback {
  width: 100%; box-sizing: border-box; margin-top: 10px; min-height: 120px; padding: 8px 10px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--cabinet); color: var(--ink);
  font: 500 13px/1.5 var(--font-mono);
}
.ranks { margin-top: 14px; padding-top: 10px; text-align: left; border-top: 1px solid var(--line); }
.ranks summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; }
.ranks ol { list-style: none; margin: 8px 0 0; padding: 0; max-height: 230px; overflow-y: auto; }
@keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }

/* 코스 선택 */
.course-row { display: flex; gap: 6px; }
.course-row select {
  flex: 1; min-width: 0; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--cabinet); color: var(--ink); font: 600 14px var(--font-body);
}
.btn-sm { padding: 8px 10px; font-size: 13px; border-radius: 10px; white-space: nowrap; }
.linklike {
  appearance: none; border: 0; background: none; padding: 6px 0 0; cursor: pointer;
  color: var(--dmd); font: 600 12.5px var(--font-body); text-decoration: underline; text-underline-offset: 3px;
}

/* 코스 편집기 */
.ed-tools {
  position: absolute; z-index: 5; left: 16px; right: 16px; margin-inline: auto; max-width: 560px;
  display: flex; gap: 4px; padding: 5px; overflow-x: auto; box-sizing: border-box;
  border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.wide .ed-tools { right: auto; margin: 0; }
.tool {
  appearance: none; flex: 1 0 42px; min-width: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 4px 5px;
  border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted);
  font: 600 11px/1.2 var(--font-body); white-space: nowrap; cursor: pointer; touch-action: manipulation;
}
.tool svg { width: 20px; height: 20px; }
.tool[aria-pressed="true"] { color: var(--dmd); background: var(--panel-2); border-color: rgba(255, 146, 46, 0.5); }
.tool:disabled { opacity: 0.4; cursor: default; }
.ed-panel { max-height: 46%; gap: 10px; }
.wide .ed-panel { max-height: calc(100% - 40px); }
.ed-hint { margin: 0; font-size: 13px; color: var(--muted); }
.ed-hint b { color: var(--ink); }
.ed-inspect { display: grid; gap: 8px; padding: 10px; border-radius: 12px; background: var(--cabinet); border: 1px solid var(--line); }
.ins-row { display: flex; align-items: center; gap: 10px; }
.ins-label { width: 34px; flex: none; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.ins-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--dmd); }
.ins-val { width: 64px; flex: none; text-align: right; font-size: 12px; color: var(--ink); }
.seg-sm { flex: 1; padding: 3px; }
.seg-sm label { padding: 6px 4px; font-size: 13px; }
.ed-name { display: flex; align-items: center; gap: 8px; }
.ed-name label { flex: none; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.ed-name input {
  flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--cabinet); color: var(--ink); font: 600 14px var(--font-body);
}
.ed-count { flex: none; font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ed-msg { margin: 0; padding: 8px 10px; border-radius: 10px; font-size: 13px; background: var(--panel-2); color: var(--ink); }
.ed-msg.warn { color: var(--danger); }
.ed-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ed-actions .btn { padding: 9px 6px; font-size: 13px; }
.ed-actions .btn-start { grid-column: span 2; min-width: 0; padding: 11px 10px; font-size: 17px; }
.import-card { text-align: left; }
.import-title { margin: 0 0 4px; font: 400 22px var(--font-display); }

/* 키가 낮은 화면: 설정 카드를 줄여 코스를 더 보여 준다 */
@media (max-height: 720px) {
  .lede, .fair { display: none; }
  textarea { min-height: 64px; }
  .apron { gap: 12px; }
}
@media (max-height: 520px) {
  #dmd, .wide #dmd { height: 44px; }
  .apron h1 { font-size: 22px; }
  .controls, .wide .controls { width: 232px; max-width: 232px; gap: 6px; padding: 6px; }
  .ctl { padding: 7px 4px; }
  .ctl span { display: none; }
}

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  .result-card { animation: none; }
  .btn-start { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="field" aria-label="핀볼 코스. 끌어서 위아래로 둘러볼 수 있어요"></canvas>

  <header class="backbox" id="backbox">
    <canvas id="dmd" aria-hidden="true"></canvas>
  </header>

  <canvas id="mini" aria-label="코스 미니맵. 누르면 그 위치로 이동해요" role="img"></canvas>

<script>
/* PinballEngine — 구슬 레이스 물리 엔진 (DOM 없음, 외부 라이브러리 없음)
 * 구슬(원) ↔ 벽(캡슐 선분) / 핀(원) / 범퍼(튕김 원) / 풍차(회전 막대) 충돌,
 * 한 프레임(1/60초)을 8번 쪼개 계산해서 빠른 구슬도 벽을 뚫지 않게 한다. */
(function (root) {
  'use strict';

  const R = 11;              // 구슬 반지름
  const GRAV = 1250;         // 중력 (단위/초²)
  const STEP = 1 / 60;       // 한 스텝
  const SUB = 8;             // 스텝당 세부 계산 횟수
  const H = STEP / SUB;
  const VMAX = 1300;         // 최고 속도
  const E_MM = 0.5;          // 구슬끼리 반발
  const BOUNCE_MIN = 70;     // 이보다 느린 충돌은 튕기지 않음 (떨림 방지)
  const DRAG = 0.1;          // 공기 저항
  const STALL_T = 3.0;       // 이 시간 동안 아래로 못 가면 살짝 튕겨줌
  const HIT_MIN = 150;       // 효과음/반짝임을 낼 최소 충돌 속도
  const MAX_MARBLES = 200;
  const CAT_PRE = 0.9;
  const TIME_LIMIT = 120;    // 이 시간이 지나도 못 들어온 구슬은 순서대로 도착 처리       // 고양이 손 예고 시간 (카메라가 그쪽으로 갈 시간)

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* "지민, 서준*3" → [{name:'지민',count:1},{name:'서준',count:3}] */
  function parseEntries(text) {
    const items = [];
    let total = 0;
    for (let raw of String(text || '').split(/[,\n，、]/)) {
      raw = raw.trim();
      if (!raw) continue;
      let name = raw, count = 1;
      const m = raw.match(/^(.*?)\s*[*＊×]\s*(\d+)$/);
      if (m && m[1].trim()) {
        name = m[1].trim();
        count = Math.min(99, parseInt(m[2], 10) || 0);
      }
      if (count <= 0) continue;
      name = name.slice(0, 20);
      items.push({ name, count });
      total += count;
    }
    return { items, total };
  }

  /* ---------- 맵 ----------
   * 맵 = 고정 틀(출발 칸·바깥 벽·결승 깔때기) + 레이아웃(꾸밀 수 있는 장애물 목록).
   * 레이아웃 항목은 짧은 배열로 저장한다 (공유 코드가 짧아지도록):
   *   ['p', x, y, r?]            핀 (r 9 이상이면 벽 돌기 모양)
   *   ['b', x, y, r, kick]       범퍼
   *   ['r', x, y, arms, len, w]  풍차 (w: 초당 회전, 음수면 반대 방향)
   *   ['w', ax, ay, bx, by]      벽(경사로)
   */
  const MAP_W = 520, MAP_H = 3540;
  const EDIT = { x0: 24, x1: 496, y0: 310, y1: 3075 };   // 꾸밀 수 있는 영역
  const MAX_ITEMS = 600;

  function defaultLayout() {
    const L = [];
    for (let i = 0; i < 15; i++) {
      const y = 330 + i * 48;
      if (i % 2 === 0) { for (let j = 0; j < 8; j++) L.push(['p', 50 + j * 60, y]); }
      else { for (let j = 0; j < 7; j++) L.push(['p', 80 + j * 60, y]); L.push(['p', 20, y, 9], ['p', 500, y, 9]); }
    }
    L.push(['r', 150, 1130, 4, 66, 2.4], ['r', 370, 1130, 4, 66, -2.4], ['r', 260, 1300, 3, 80, 1.8],
      ['r', 118, 1460, 4, 62, -2.8], ['r', 402, 1460, 4, 62, 2.8], ['r', 260, 1620, 2, 100, -1.5]);
    L.push(['p', 260, 1150], ['p', 60, 1300], ['p', 460, 1300], ['p', 260, 1460], ['p', 60, 1620], ['p', 460, 1620]);
    L.push(['w', 12, 1798, 382, 1893], ['w', 508, 1978, 138, 2073], ['w', 12, 2158, 382, 2253], ['w', 508, 2338, 138, 2433]);
    L.push(['p', 422, 1945], ['p', 98, 2125], ['p', 422, 2305], ['p', 98, 2485]);
    L.push(['w', 12, 2505, 170, 2565]);
    L.push(['b', 260, 2645, 24, 600], ['b', 195, 2735, 24, 600], ['b', 325, 2735, 24, 600],
      ['b', 20, 2700, 12, 380], ['b', 500, 2700, 12, 380]);
    L.push(['p', 60, 2800], ['p', 460, 2800], ['p', 260, 2830]);
    L.push(['b', 135, 2900, 22, 560], ['b', 385, 2900, 22, 560], ['b', 260, 2990, 22, 560]);
    return L;
  }

  /* 밖에서 들어온 레이아웃(공유 코드 등)을 안전한 범위로 다듬는다 */
  function cleanLayout(items) {
    const out = [];
    const n = (v, a, b, d) => { v = Number(v); if (!isFinite(v)) v = d; return Math.round(Math.max(a, Math.min(b, v)) * 10) / 10; };
    const X = (v) => n(v, 12, 508, 260), Y = (v) => n(v, EDIT.y0, EDIT.y1, 1000);
    for (const it of Array.isArray(items) ? items : []) {
      if (!Array.isArray(it) || out.length >= MAX_ITEMS) continue;
      const t = it[0];
      if (t === 'p') out.push(it[3] != null ? ['p', X(it[1]), Y(it[2]), n(it[3], 4, 12, 6)] : ['p', X(it[1]), Y(it[2])]);
      else if (t === 'b') out.push(['b', X(it[1]), Y(it[2]), n(it[3], 10, 34, 22), n(it[4], 200, 800, 560)]);
      else if (t === 'r') out.push(['r', X(it[1]), Y(it[2]), Math.round(n(it[3], 2, 4, 4)), n(it[4], 30, 120, 66), n(it[5], -4, 4, 2)]);
      else if (t === 'w') {
        const w = ['w', X(it[1]), Y(it[2]), X(it[3]), Y(it[4])];
        if (Math.hypot(w[3] - w[1], w[4] - w[2]) >= 12) out.push(w);
      }
    }
    return out;
  }

  function buildMap(layout) {
    const W = MAP_W, HH = MAP_H;
    const custom = Array.isArray(layout);
    const items = custom ? cleanLayout(layout) : defaultLayout();
    const segs = [], circs = [], rotors = [];

    const seg = (ax, ay, bx, by, t, kind, e, f) => {
      const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
      let nx = -dy / len, ny = dx / len;
      if (ny > 0) { nx = -nx; ny = -ny; }
      segs.push({ seg: true, ax, ay, bx, by, t: t == null ? 8 : t, kind: kind || 'wall',
        e: e == null ? 0.3 : e, f: f == null ? 0.06 : f, len2: len * len, nx, ny, flash: 0 });
    };
    // 핀은 마찰 0 + 꼭대기 균형 방지(resolveContact) → 핀 위에 멈춰 서지 않음
    const circ = (x, y, r, kind, e, kick) =>
      circs.push({ seg: false, x, y, r, kind, e, f: 0, kick: kick || 0, flash: 0, round: true });
    const rotor = (cx, cy, arms, len, omega, fixed) =>
      rotors.push({ cx, cy, arms, len, omega, t: 6, e: 0.35, f: 0.05, angle: 0, kind: 'rotor', kick: 0, flash: 0, fixed: !!fixed });

    // 고정 틀: 바깥 벽
    seg(12, 0, 508, 0, 8);
    seg(12, 0, 12, 3100, 8);
    seg(508, 0, 508, 3100, 8);

    // 꾸민 장애물
    for (const it of items) {
      if (it[0] === 'p') { const r = it[3] || 6; circ(it[1], it[2], r, r >= 9 ? 'nub' : 'peg', r >= 9 ? 0.35 : 0.45, 0); }
      else if (it[0] === 'b') circ(it[1], it[2], it[3], it[3] < 16 ? 'kicker' : 'bumper', it[3] < 16 ? 0.5 : 0.7, it[4]);
      else if (it[0] === 'r') rotor(it[1], it[2], it[3], it[4], it[5]);
      else if (it[0] === 'w') seg(it[1], it[2], it[3], it[4], 7, 'shelf', 0.25, 0.02);
    }

    // 고정 틀: 결승 깔때기
    seg(12, 3100, 195, 3330, 8);
    seg(508, 3100, 325, 3330, 8);
    rotor(260, 3245, 2, 52, 3.4, true);
    seg(195, 3330, 195, 3500, 8);
    seg(325, 3330, 325, 3500, 8);

    const map = {
      W, H: HH, R, segs, circs, rotors, custom, layout: items,
      finishY: 3440,
      gateY: 284,
      spawn: { x0: 20, x1: 500, yBottom: 262 },
      chute: { x0: 195, x1: 325 },
      edit: EDIT,
      sections: custom ? [{ key: 'final', label: '결승', y0: 3080, y1: 3540 }] : [
        { key: 'forest', label: '핀 숲', y0: 290, y1: 1040 },
        { key: 'mill', label: '풍차', y0: 1040, y1: 1760 },
        { key: 'zigzag', label: '지그재그', y0: 1760, y1: 2495 },
        { key: 'bumper', label: '범퍼', y0: 2495, y1: 3080 },
        { key: 'final', label: '결승', y0: 3080, y1: 3540 },
      ],
      // 장식용 화살표 램프 (물리에는 영향 없음)
      inserts: custom ? [{ x: 260, y: 3360 }, { x: 260, y: 3392 }] : [
        { x: 200, y: 1050 }, { x: 260, y: 1062 }, { x: 320, y: 1050 },
        { x: 200, y: 1745 }, { x: 260, y: 1757 }, { x: 320, y: 1745 },
        { x: 330, y: 2540 }, { x: 380, y: 2552 }, { x: 430, y: 2540 },
        { x: 260, y: 3360 }, { x: 260, y: 3392 },
      ],
    };
    map.grid = buildGrid(W, HH, segs.concat(circs));
    return map;
  }

  /* 공유 코드: "PB1." + base64(JSON) */
  function encodeLayout(items) {
    const json = JSON.stringify(cleanLayout(items));
    const bytes = new TextEncoder().encode(json);
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return 'PB1.' + btoa(bin).replace(/=+$/, '');
  }
  function decodeLayout(code) {
    const m = String(code || '').trim().match(/PB1\.([A-Za-z0-9+/_-]+)/);
    if (!m) return null;
    try {
      const bin = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
      const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      const items = cleanLayout(JSON.parse(new TextDecoder().decode(bytes)));
      return items;
    } catch (e) { return null; }
  }

  function buildGrid(W, HH, objs) {
    const cs = 64, pad = R + 2;
    const cols = Math.ceil(W / cs) + 1, rows = Math.ceil((HH + 64) / cs) + 1;
    const cells = new Array(cols * rows);
    for (let i = 0; i < cells.length; i++) cells[i] = [];
    const ci = (v, n) => (v < 0 ? 0 : v >= n ? n - 1 : v);
    for (const o of objs) {
      let x0, y0, x1, y1;
      if (o.seg) {
        x0 = Math.min(o.ax, o.bx) - o.t; x1 = Math.max(o.ax, o.bx) + o.t;
        y0 = Math.min(o.ay, o.by) - o.t; y1 = Math.max(o.ay, o.by) + o.t;
      } else {
        x0 = o.x - o.r; x1 = o.x + o.r; y0 = o.y - o.r; y1 = o.y + o.r;
      }
      const c0 = ci(Math.floor((x0 - pad) / cs), cols), c1 = ci(Math.floor((x1 + pad) / cs), cols);
      const r0 = ci(Math.floor((y0 - pad) / cs), rows), r1 = ci(Math.floor((y1 + pad) / cs), rows);
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) cells[r * cols + c].push(o);
    }
    return {
      at(x, y) {
        return cells[ci(Math.floor(y / cs), rows) * cols + ci(Math.floor(x / cs), cols)];
      },
    };
  }

  /* 출발 칸: 아래 줄부터 채우고 각 줄은 가운데 정렬 */
  function spawnSlots(map, n) {
    const left = map.spawn.x0 + R + 4, right = map.spawn.x1 - R - 4;
    const span = right - left;
    const maxCols = Math.floor(span / 24) + 1;
    const rows = Math.max(1, Math.ceil(n / maxCols));
    const cols = Math.ceil(n / rows);
    const gap = cols > 1 ? Math.max(24, Math.min(64, span / (cols - 1))) : 0;
    const out = [];
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / cols), col = i % cols;
      const inRow = Math.min(cols, n - row * cols);
      const width = (inRow - 1) * gap;
      const x0 = (left + right) / 2 - width / 2;
      out.push({ x: x0 + col * gap, y: map.spawn.yBottom - row * 24 });
    }
    return out;
  }

  /* ---------- 충돌 ---------- */
  function resolveContact(m, nx, ny, pen, obj, svx, svy, race) {
    m.x += nx * pen; m.y += ny * pen;
    const rvx = m.vx - svx, rvy = m.vy - svy;
    const vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    let jn;
    if (obj.kick) {
      jn = Math.max(-vn * obj.e, obj.kick) - vn;
      obj.flash = 1;
      race.emit('bump', obj.kind, m.x, m.y, -vn);
    } else {
      jn = -(1 + (-vn > BOUNCE_MIN ? obj.e : 0)) * vn;
      if (-vn > HIT_MIN) { obj.flash = 1; race.emit('hit', obj.kind, m.x, m.y, -vn); }
      // 둥근 핀 꼭대기에 거의 수직으로 얹힌 구슬은 옆으로 살짝 밀어 균형을 깬다
      else if (obj.round && ny < -0.92) m.vx += (nx > 0.002 ? 3 : nx < -0.002 ? -3 : (race.rng() < 0.5 ? -3 : 3));
    }
    const tx = -ny, ty = nx;
    const vt = rvx * tx + rvy * ty;
    const maxF = obj.f * jn;
    const dvt = Math.abs(vt) <= maxF ? -vt : (vt > 0 ? -maxF : maxF);
    m.vx += nx * jn + tx * dvt;
    m.vy += ny * jn + ty * dvt;
  }

  function collideSeg(m, s, race) {
    const abx = s.bx - s.ax, aby = s.by - s.ay;
    let t = ((m.x - s.ax) * abx + (m.y - s.ay) * aby) / s.len2;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const dx = m.x - (s.ax + abx * t), dy = m.y - (s.ay + aby * t);
    const minD = R + s.t, d2 = dx * dx + dy * dy;
    if (d2 >= minD * minD) return;
    const d = Math.sqrt(d2);
    if (d > 1e-6) resolveContact(m, dx / d, dy / d, minD - d, s, 0, 0, race);
    else resolveContact(m, s.nx, s.ny, minD, s, 0, 0, race);
  }

  function collideCirc(m, c, race) {
    const dx = m.x - c.x, dy = m.y - c.y;
    const minD = R + c.r, d2 = dx * dx + dy * dy;
    if (d2 >= minD * minD) return;
    const d = Math.sqrt(d2);
    if (d > 1e-6) resolveContact(m, dx / d, dy / d, minD - d, c, 0, 0, race);
    else resolveContact(m, 0, -1, minD, c, 0, 0, race);
  }

  function collideRotor(m, r, race) {
    const reach = r.len + r.t + R;
    let ox = m.x - r.cx, oy = m.y - r.cy;
    if (ox * ox + oy * oy > reach * reach) return;
    const stepA = (Math.PI * 2) / r.arms, L2 = r.len * r.len, minD = R + r.t;
    for (let k = 0; k < r.arms; k++) {
      ox = m.x - r.cx; oy = m.y - r.cy;
      const a = r.angle + k * stepA;
      const ex = Math.cos(a) * r.len, ey = Math.sin(a) * r.len;
      let t = (ox * ex + oy * ey) / L2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const px = ex * t, py = ey * t;
      const dx = ox - px, dy = oy - py, d2 = dx * dx + dy * dy;
      if (d2 >= minD * minD) continue;
      const d = Math.sqrt(d2);
      // 접점의 회전 속도 = ω × r
      const svx = -r.omega * py, svy = r.omega * px;
      if (d > 1e-6) resolveContact(m, dx / d, dy / d, minD - d, r, svx, svy, race);
      else resolveContact(m, 0, -1, minD, r, svx, svy, race);
    }
  }

  function collideMarbles(list) {
    // y 기준 삽입 정렬 (거의 정렬된 상태라 빠름)
    for (let i = 1; i < list.length; i++) {
      const m = list[i];
      let j = i - 1;
      while (j >= 0 && list[j].y > m.y) { list[j + 1] = list[j]; j--; }
      list[j + 1] = m;
    }
    const D = 2 * R, D2 = D * D;
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        const dy = b.y - a.y;
        if (dy >= D) break;
        const dx = b.x - a.x;
        if (dx >= D || dx <= -D) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 >= D2) continue;
        let d = Math.sqrt(d2), nx, ny;
        if (d > 1e-6) { nx = dx / d; ny = dy / d; } else { nx = 1; ny = 0; d = 0; }
        const pen = (D - d) * 0.5;
        a.x -= nx * pen; a.y -= ny * pen;
        b.x += nx * pen; b.y += ny * pen;
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) {
          const jn = -(1 + (-rv > BOUNCE_MIN ? E_MM : 0)) * rv * 0.5;
          a.vx -= jn * nx; a.vy -= jn * ny;
          b.vx += jn * nx; b.vy += jn * ny;
        }
      }
    }
  }

  /* ---------- 레이스 ---------- */
  class Race {
    /* entries: 출발 칸 순서대로 [{name, color}] / opts: {mode:'first'|'last'|'rank', rank, seed} */
    constructor(map, entries, opts) {
      opts = opts || {};
      this.map = map;
      this.N = entries.length;
      this.seed = (opts.seed >>> 0) || 1;
      this.rng = mulberry32(this.seed);
      const slots = spawnSlots(map, this.N);
      this.marbles = entries.map((e, i) => ({
        id: i, name: e.name, color: e.color, key: e.key,
        x: slots[i].x, y: slots[i].y, vx: 0, vy: 0,
        best: slots[i].y, stall: 0, nudges: 0,
        finished: false, rank: 0, time: 0,
      }));
      this.active = this.marbles.slice();
      this.finished = [];
      this.time = 0;
      this.started = false;
      this.mode = opts.mode || 'first';
      this.targetRank = this.mode === 'last' ? this.N
        : this.mode === 'rank' ? Math.max(1, Math.min(this.N, opts.rank | 0)) : 1;
      this.winner = null;
      this.events = [];
      this.resets = 0;
      // 스킬: 구슬이 가끔 '펑' 터져 주변 구슬을 밀어냄. 전체로 대략 1초에 한 번꼴이 되도록 간격을 구슬 수에 맞춘다
      this.skills = opts.skills !== false;
      this.skillGap = Math.max(8, this.N);
      for (const m of this.marbles) m.skillCd = 2 + this.rng() * this.skillGap;
      this.skillCount = 0;
      // 고양이 손: 가끔 구슬 하나를 낚아채 갔다가 위쪽 코스에 다시 떨어뜨림
      this.cats = opts.cats !== false;
      this.catCd = 4 + this.rng() * 4;
      this.cat = null;
      this.held = [];
      this.catCount = 0;
      for (const r of map.rotors) r.angle = this.rng() * Math.PI * 2;
      for (const o of map.circs) o.flash = 0;
    }

    emit(type, kind, x, y, v) {
      if (this.events.length < 400) this.events.push({ type, kind, x, y, v });
    }

    release() {
      for (const m of this.marbles) {
        m.vx = (this.rng() - 0.5) * 40;
        m.vy = this.rng() * 30;
      }
      this.started = true;
    }

    /* frac: 한 스텝(1/60초)의 몇 배만큼 진행할지 (0~1). 슬로모션에서도 매 프레임 조금씩 움직여 부드럽다 */
    step(frac) {
      if (!this.started) return;
      const f = frac == null ? 1 : Math.max(0, Math.min(1, frac));
      if (f <= 0) return;
      const h = (STEP * f) / SUB;
      for (let s = 0; s < SUB; s++) this.substep(h);
    }

    substep(H) {
      const map = this.map, act = this.active, rotors = map.rotors;
      this.time += H;
      for (let i = 0; i < rotors.length; i++) rotors[i].angle += rotors[i].omega * H;

      const damp = 1 - DRAG * H, g = GRAV * H, vmax2 = VMAX * VMAX;
      for (let i = 0; i < act.length; i++) {
        const m = act[i];
        m.vy += g;
        m.vx *= damp; m.vy *= damp;
        const s2 = m.vx * m.vx + m.vy * m.vy;
        if (s2 > vmax2) { const k = VMAX / Math.sqrt(s2); m.vx *= k; m.vy *= k; }
        m.x += m.vx * H; m.y += m.vy * H;
      }

      collideMarbles(act);

      const grid = map.grid;
      for (let i = 0; i < act.length; i++) {
        const m = act[i];
        const cell = grid.at(m.x, m.y);
        for (let k = 0; k < cell.length; k++) {
          const o = cell[k];
          if (o.seg) collideSeg(m, o, this); else collideCirc(m, o, this);
        }
        for (let k = 0; k < rotors.length; k++) collideRotor(m, rotors[k], this);

        if (!(m.x > 0 && m.x < map.W && m.y > -60 && m.y < map.H + 60)) this.rescue(m);

        if (m.y > m.best + 3) { m.best = m.y; m.stall = 0; }
        else if ((m.stall += H) > STALL_T) this.nudge(m);
      }

      if (this.skills) {
        for (let i = 0; i < act.length; i++) {
          const m = act[i];
          if ((m.skillCd -= H) > 0) continue;
          m.skillCd = this.skillGap * (0.5 + this.rng());
          if (m.y < map.finishY - 80) this.blast(m);
        }
      }

      if (this.cats) this.updateCat(H);

      let fin = null;
      for (let i = act.length - 1; i >= 0; i--) {
        if (act[i].y > map.finishY) { (fin || (fin = [])).push(act[i]); act.splice(i, 1); }
      }
      if (fin) {
        fin.sort((a, b) => b.y - a.y);
        for (const m of fin) {
          m.finished = true;
          m.rank = this.finished.length + 1;
          m.time = this.time;
          this.finished.push(m);
          this.events.push({ type: 'finish', m });
        }
      }
      // 안전장치: 직접 만든 맵에서 구슬이 영영 갇혀도 2분이 지나면 결승선에 가까운 순서대로 도착 처리
      if (this.time > TIME_LIMIT && (this.active.length || this.held.length) && !this.cat) {
        const rest = this.active.splice(0).concat(this.held.splice(0)).sort((a, b) => b.y - a.y);
        for (const m of rest) {
          m.finished = true; m.timedOut = true; m.hidden = false;
          m.rank = this.finished.length + 1; m.time = this.time;
          this.finished.push(m);
          this.events.push({ type: 'finish', m });
        }
      }
      if (!this.winner) this.checkWinner();
    }

    checkWinner() {
      const T = this.targetRank, F = this.finished.length;
      let w = null;
      if (F >= T) w = this.finished[T - 1];
      else if (T === this.N && this.active.length + this.held.length === 1) w = this.active[0] || this.held[0];
      if (w) {
        this.winner = w;
        this.winTime = this.time;
        this.events.push({ type: 'winner', m: w });
      }
    }

    updateCat(H) {
      const map = this.map, c = this.cat;
      const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
      if (c) {
        c.t += H;
        const m = c.m;
        if (c.t < 0) {                          // 예고: 벽 틈으로 앞발을 살짝 내밀고 구슬을 노려봄
          const k = ease(Math.min(1, (c.t + CAT_PRE) / 0.35));
          const wall = c.side < 0 ? 4 : map.W - 4;
          c.gx = m.x; c.gy = m.y; c.oy = m.y - 40;
          c.px = c.ox + (wall + c.side * -26 - c.ox) * k; c.py = c.oy + Math.sin(c.t * 18) * 4;
          return;
        }
        if (!c.grabbed) {                       // 낚아채기 시작
          c.grabbed = true; c.sx = c.px; c.sy = c.py;
          c.gx = m.x; c.gy = m.y;
          const i = this.active.indexOf(m);
          if (i >= 0) this.active.splice(i, 1);
          this.held.push(m);
          m.vx = 0; m.vy = 0;
          this.events.push({ type: 'catgrab', m, x: m.x, y: m.y });
        }
        if (c.t < 0.45) {                       // 앞발이 쭉 뻗어 옴
          const k = ease(c.t / 0.45);
          c.px = c.sx + (c.gx - c.sx) * k; c.py = c.sy + (c.gy - c.sy) * k;
          m.x = c.gx; m.y = c.gy;
        } else if (c.t < 1.15) {                // 구슬을 쥐고 벽 밖으로
          const k = ease((c.t - 0.45) / 0.7);
          c.px = c.gx + (c.ox - c.gx) * k; c.py = c.gy + (c.oy - 150 - c.gy) * k;
          m.x = c.px; m.y = c.py;
        } else if (c.t < 1.9) {                 // 잠깐 사라짐
          m.hidden = true; c.px = c.ox; c.py = c.oy - 150;
        } else {                                // 위쪽 코스에 다시 떨어뜨림
          m.hidden = false;
          m.x = c.dropX; m.y = c.dropY; m.vx = 0; m.vy = 60;
          m.best = m.y; m.stall = 0;
          this.held.splice(this.held.indexOf(m), 1);
          this.active.push(m);
          this.events.push({ type: 'catdrop', m, x: m.x, y: m.y });
          this.cat = null;
          this.catCd = 5 + this.rng() * 5;
        }
        return;
      }
      if (this.winner || (this.catCd -= H) > 0) return;
      // 화면에서 보이도록 지금 당첨 후보 근처 구슬 중에서 무작위로 고른다
      const ok = (m) => m.y > 420 && m.y < map.finishY - 420;
      const cy = (this.contender() || {}).y || 0;
      let pool = this.active.filter((m) => ok(m) && Math.abs(m.y - cy) < 380);
      if (!pool.length) pool = this.active.filter(ok);
      if (!pool.length) { this.catCd = 1; return; }
      const m = pool[Math.floor(this.rng() * pool.length)];
      const side = m.x < map.W / 2 ? -1 : 1;
      const ox = side < 0 ? -80 : map.W + 80, oy = m.y - 40;
      this.cat = {
        m, t: -CAT_PRE, side, grabbed: false, gx: m.x, gy: m.y, ox, oy, px: ox, py: oy,
        // 잡힌 자리에서 조금 위(약 200~300)로 다시 떨어뜨림
        dropX: Math.max(70, Math.min(map.W - 70, m.x + (this.rng() - 0.5) * 80)),
        dropY: Math.max(330, m.y - 200 - this.rng() * 100),
      };
      this.catCount++;
      this.events.push({ type: 'cat', m, x: m.x, y: m.y });
    }

    /* 펑! 반경 안의 다른 구슬을 바깥으로 밀어낸다 (가까울수록 세게) */
    blast(m) {
      const RAD = 110, POW = 820;
      for (const o of this.active) {
        if (o === m) continue;
        const dx = o.x - m.x, dy = o.y - m.y, d = Math.hypot(dx, dy);
        if (d >= RAD || d < 1e-3) continue;
        const f = POW * (1 - d / RAD);
        o.vx += (dx / d) * f;
        o.vy += (dy / d) * f - 60;
        o.stall = 0;
      }
      this.skillCount++;
      this.events.push({ type: 'skill', m, x: m.x, y: m.y });
    }

    nudge(m) {
      m.vx = (this.rng() - 0.5) * 520;
      m.vy = -(220 + this.rng() * 260);
      m.stall = 0;
      m.best = m.y;
      m.nudges++;
      this.events.push({ type: 'nudge', m });
    }

    rescue(m) {
      m.x = this.map.W / 2;
      m.y = Math.max(40, Math.min(this.map.finishY - 40, m.best - 80));
      m.vx = 0; m.vy = 0;
      this.resets++;
    }

    /* 사용자 '흔들기' */
    shake(power) {
      const p = power || 1;
      for (const m of this.active) {
        m.vx += (this.rng() - 0.5) * 520 * p;
        m.vy -= (160 + this.rng() * 220) * p;
        m.stall = 0;
      }
    }

    /* 결승선에 가까운 순서 (도착한 구슬 먼저) */
    standings() {
      return this.finished.concat(this.active.concat(this.held).sort((a, b) => b.y - a.y));
    }

    /* 지금 당첨 자리에 있는 구슬 */
    contender() {
      if (this.winner) return this.winner;
      const act = this.active.concat(this.held).sort((a, b) => b.y - a.y);
      if (!act.length) return null;
      const idx = this.targetRank - 1 - this.finished.length;
      return act[Math.max(0, Math.min(act.length - 1, idx))];
    }

    /* 당첨이 갈리는 순간이 코앞인지 (슬로모션용) */
    decisive() {
      if (this.winner || !this.started) return false;
      const act = this.active.concat(this.held).sort((a, b) => b.y - a.y);
      const deciding = this.targetRank === this.N ? this.N - 1 : this.targetRank;
      const k = deciding - this.finished.length - 1;
      if (k < 0 || k >= act.length) return false;
      const a = act[k];
      if (this.map.finishY - a.y > 600) return false;
      const near = (b) => !!b && Math.abs(b.y - a.y) < 140;
      return near(act[k - 1]) || near(act[k + 1]);
    }
  }

  const api = { R, STEP, SKILL_RADIUS: 110, EDIT, MAX_ITEMS, TIME_LIMIT, defaultLayout, cleanLayout, encodeLayout, decodeLayout, MAX_MARBLES, buildMap, spawnSlots, parseEntries, Race, mulberry32 };

  }

  function drawFocus(m, t) {
    if (!m || m.finished) return;
    const x = sx(m.x), y = sy(m.y), rs = R * L.scale, won = !!S.winner;
    const pulse = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(t * 8);
    const col = won ? C.insert : C.dmd;
    fx.strokeStyle = col; fx.lineWidth = 2;
    circle(x, y, rs + 4 + pulse * 2); fx.stroke();
    const py = y - rs - 9 - pulse * 2;
    fx.fillStyle = col;
    fx.beginPath(); fx.moveTo(x - 6, py - 8); fx.lineTo(x + 6, py - 8); fx.lineTo(x, py); fx.closePath(); fx.fill();
  }

  function drawConfetti() {
    for (const c of S.confetti) {
      fx.save();
      fx.globalAlpha = Math.min(1, (c.life - c.t) * 1.5);
      fx.translate(c.x, c.y); fx.rotate(c.rot);
      fx.fillStyle = c.color; fx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      fx.restore();
    }
  }

  function drawMini(list, focus) {
    const r = L.rail;
    if (!r || !miniBg) return;
    mx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    mx.clearRect(0, 0, r.w, r.h);
    mx.drawImage(miniBg, 0, 0, r.w, r.h);
    const kx = (r.w - 6) / MAP.W, ky = (r.h - 6) / MAP.H;
    const v0 = S.camY - (L.focusY - L.top) / L.scale, v1 = S.camY + (L.h - L.bottom - L.focusY) / L.scale;
    mx.fillStyle = rgba(C.ink, 0.08); mx.strokeStyle = rgba(C.ink, 0.55); mx.lineWidth = 1;
    const vy = 3 + Math.max(0, v0) * ky, vh = Math.max(4, (Math.min(MAP.H, v1) - Math.max(0, v0)) * ky);
    mx.fillRect(1.5, vy, r.w - 3, vh); mx.strokeRect(1.5, vy, r.w - 3, vh);
    for (let i = 0; i < list.length; i++) {
      const m = list[i];
      mx.fillStyle = m.color;
      mx.fillRect(3 + m.x * kx - 1.5, 3 + m.y * ky - 1.5, 3, 3);
    }
    if (focus && !focus.finished) {
      mx.strokeStyle = S.winner ? C.insert : C.dmd; mx.lineWidth = 1.5;
      mx.beginPath(); mx.arc(3 + focus.x * kx, 3 + focus.y * ky, 4, 0, TAU); mx.stroke();
    }
  }

  function render(now) {
    const t = now / 1000, s = L.scale;
    fx.setTransform(1, 0, 0, 1, 0, 0);
    if (backdrop) fx.drawImage(backdrop, 0, 0);
    else { fx.fillStyle = C.cabinet; fx.fillRect(0, 0, field.width, field.height); }
    let shx = 0, shy = 0;
    if (S.shakeT > 0) { const a = S.shakeT * 22; shx = (Math.random() - 0.5) * a; shy = (Math.random() - 0.5) * a; }
    fx.setTransform(L.dpr * s, 0, 0, L.dpr * s, L.dpr * (L.ox + shx), L.dpr * (L.focusY - S.camY * s + shy));
    const y0 = S.camY - L.focusY / s - 60, y1 = S.camY + (L.h - L.focusY) / s + 60;
    drawPlate(y0, y1);
    drawInserts(t, y0, y1);
    drawFinish(y0, y1);
    drawStatics(y0, y1);
    drawBumpers(y0, y1);
    drawRotors(y0, y1);
    drawGate(S.phase === 'setup' ? 0 : S.gate);
    const list = marblesForDraw();
    drawMarbles(list, y0, y1);
    drawParticles();
    fx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    const focus = currentFocus();
    drawLabels(list, focus);
    drawFocus(focus, t);
    if (vignette) fx.drawImage(vignette, 0, 0, L.w, L.h);
    drawConfetti();
    drawMini(list, focus);
    DMD.draw(now);
  }

  /* ---------- 매 프레임 ---------- */
  function updatePreview(dt) {
    const k = 1 - Math.exp(-dt * 12);
    for (const p of S.preview) {
      p.x += (p.tx - p.x) * k;
      if (p.y < p.ty || p.vy) {
        p.vy += 1800 * dt; p.y += p.vy * dt;
        if (p.y >= p.ty) { p.y = p.ty; p.vy = p.vy > 160 ? -p.vy * 0.32 : 0; }
      } else {
        p.y += (p.ty - p.y) * k;
      }
    }
  }

  function update(dt, now) {
    if (S.phase === 'setup') updatePreview(dt);
    else if (S.phase === 'countdown') updateCountdown(dt);
    else if (S.race) updateRace(dt, now);
    const decay = Math.exp(-dt * 5);
    for (const c of MAP.circs) if (c.flash) c.flash = c.flash > 0.01 ? c.flash * decay : 0;
    updateParticles(dt);
    updateCamera(dt, now);
    if (S.shakeT > 0) S.shakeT = Math.max(0, S.shakeT - dt);
    if (S.race && (S.phase === 'race' || S.phase === 'done')) {
      DMD.set(raceContent());
      if (now - S.lastUi > 200) { S.lastUi = now; renderBoard(); renderTicker(); }
      const left = S.shakeReady - now;
      ui.shakeCd.style.width = left > 0 ? (100 * left) / 1500 + '%' : '0%';
      const dis = S.phase !== 'race' || left > 0;
      if (ui.shake.disabled !== dis) ui.shake.disabled = dis;
    }
  }

  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    update(dt, now);
    render(now);
    requestAnimationFrame(frame);
  }

  /* ---------- 이벤트 연결 ---------- */
  function paintSound() {
    ui.sound.setAttribute('aria-pressed', String(S.sound));
    ui.soundLabel.textContent = S.sound ? '소리 켬' : '소리 끔';
    ui.sound.querySelector('.wave').toggleAttribute('hidden', !S.sound);
    ui.sound.querySelector('.mute').toggleAttribute('hidden', S.sound);
  }

  function wire() {
    ui.names.addEventListener('input', () => { syncPreview(); save(); });
    ui.names.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); startRace(); }
    });
    modeInputs.forEach((r) => r.addEventListener('change', () => {
      if (!r.checked) return;
      S.mode = r.value;
      ui.rankRow.hidden = S.mode !== 'rank';
      validate(); save();
      DMD.set(idleContent(), true);
    }));
    ui.rankNum.addEventListener('input', () => {
      S.rank = Math.max(1, parseInt(ui.rankNum.value, 10) || 1);
      validate(); save();
      DMD.set(idleContent(), true);
    });
    ui.start.addEventListener('click', startRace);

    ui.shake.addEventListener('click', () => {
      const now = performance.now();
      if (S.phase !== 'race' || !S.race || now < S.shakeReady) return;
      S.race.shake(1);
      S.shakeReady = now + 1500;
      if (!reduceMotion) S.shakeT = 0.35;
      Sound.shake();
    });
    ui.speed.addEventListener('click', () => {
      S.speed = S.speed === 1 ? 2 : 1;
      ui.speed.setAttribute('aria-pressed', String(S.speed === 2));
    });
    ui.sound.addEventListener('click', () => { S.sound = !S.sound; Sound.unlock(); paintSound(); save(); });
    ui.stop.addEventListener('click', goSetup);
    ui.again.addEventListener('click', () => {
      ui.result.hidden = true;
      const slots = E.spawnSlots(MAP, Math.max(1, S.preview.length));
      S.preview.forEach((p, i) => { p.x = slots[i].x; p.y = slots[i].y; p.vy = 0; });
      startRace();
    });
    ui.edit.addEventListener('click', () => { goSetup(); if (L.wide) ui.names.focus(); });
    ui.copy.addEventListener('click', () => {
      if (!S.winner) return;
      const txt = resultText();
      const ok = () => {
        ui.copy.textContent = '복사했어요';
        setTimeout(() => { ui.copy.textContent = '결과 복사'; }, 1600);
      };
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.className = 'copy-fallback'; ta.id = 'copyText'; ta.readOnly = true; ta.value = txt;
        ta.setAttribute('aria-label', '결과 글자');
        ui.copySlot.replaceChildren(ta);
        ta.focus(); ta.select();
        ui.copy.textContent = '선택된 글자를 복사하세요';
      };
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(txt);
        if (p && p.then) p.then(ok, fallback); else fallback();
      } catch (e) { fallback(); }
    });
    ui.ranks.addEventListener('toggle', renderResultList);
    ui.boardList.addEventListener('wheel', () => { ui.boardList._userScroll = performance.now() + 4000; }, { passive: true });
    ui.boardList.addEventListener('touchmove', () => { ui.boardList._userScroll = performance.now() + 4000; }, { passive: true });

    // 코스 끌어서 둘러보기
    let drag = null;
    field.addEventListener('pointerdown', (e) => {
      drag = { id: e.pointerId, y: e.clientY, cam: S.camY, moved: false };
      try { field.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    });
    field.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dy) > 5) { drag.moved = true; field.classList.add('is-dragging'); }
      if (drag.moved) { S.camY = drag.cam - dy / L.scale; S.manualUntil = performance.now() + 6000; }
    });
    const endDrag = (e) => {
      if (drag && e.pointerId === drag.id) { drag = null; field.classList.remove('is-dragging'); }
    };
    field.addEventListener('pointerup', endDrag);
    field.addEventListener('pointercancel', endDrag);
    field.addEventListener('wheel', (e) => {
      e.preventDefault();
      S.camY += (e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY) / L.scale;
      S.manualUntil = performance.now() + 6000;
    }, { passive: false });

    let miniDrag = false;
    const miniJump = (e) => {
      const r = mini.getBoundingClientRect();
      S.camY = clamp((e.clientY - r.top) / r.height, 0, 1) * MAP.H;
      S.manualUntil = performance.now() + 6000;
    };
    mini.addEventListener('pointerdown', (e) => {
      miniDrag = true; miniJump(e);
      try { mini.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    });
    mini.addEventListener('pointermove', (e) => { if (miniDrag) miniJump(e); });
    mini.addEventListener('pointerup', () => { miniDrag = false; });
    mini.addEventListener('pointercancel', () => { miniDrag = false; });
    ui.follow.addEventListener('click', () => { S.manualUntil = 0; });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && (S.phase === 'race' || S.phase === 'countdown')) keepAwake(true);
    });

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => layout());
      ro.observe(app); ro.observe(ui.setup);
    } else {
      window.addEventListener('resize', layout);
    }

    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load(`20px ${FONT_DISPLAY}`, '핀볼 뽑기 당첨'),
        document.fonts.load(`600 12px ${FONT_BODY}`, '가나다 ABC'),
      ]).then(() => { labelSprites.clear(); DMD.invalidate(); }).catch(() => {});
    }

    try {
      const hot = window.claude && window.claude.hot;
      if (hot && hot.snapshot) hot.snapshot(() => ({ names: ui.names.value, mode: S.mode, rank: S.rank, sound: S.sound }));
    } catch (e) { /* 미리보기 밖에서는 없음 */ }
  }

  function boot(data) {
    data = data || {};
    const names = typeof data.names === 'string' ? data.names : store.get('names', EXAMPLE);
    ui.names.value = typeof names === 'string' ? names : EXAMPLE;
    const mode = data.mode || store.get('mode', 'first');
    S.mode = ['first', 'last', 'rank'].includes(mode) ? mode : 'first';
    S.rank = Math.max(1, parseInt(data.rank || store.get('rank', 2), 10) || 2);
    const snd = data.sound != null ? data.sound : store.get('sound', true);
    S.sound = snd !== false;
    modeInputs.forEach((r) => { r.checked = r.value === S.mode; });
    ui.rankRow.hidden = S.mode !== 'rank';
    ui.rankNum.value = String(S.rank);
    paintSound();
    wire();
    layout();
    syncPreview();
    setPhaseUI();
    S.camY = (S.topSlotY + MAP.gateY + 100) / 2;
    requestAnimationFrame(frame);

  }

  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot);
  else boot(hot && hot.data ? hot.data : {});
})();

</script>
</body>

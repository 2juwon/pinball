    const half = (MAP.W * L.scale) / 2;
    const glowAt = (x, color) => {
      const rg = b.createRadialGradient(x * L.dpr, cy, 0, x * L.dpr, cy, L.h * 0.75 * L.dpr);
      rg.addColorStop(0, rgba(color, 0.13)); rg.addColorStop(1, rgba(color, 0));
      b.fillStyle = rg; b.fillRect(0, 0, backdrop.width, backdrop.height);
    };
    glowAt(L.cx - half, C.insert);
    glowAt(L.cx + half, C.spinner);
    b.fillStyle = rgba(C.ink, 0.05);
    const step = 14 * L.dpr, r = 1.3 * L.dpr;
    for (let y = step / 2; y < backdrop.height; y += step) {
      for (let x = step / 2; x < backdrop.width; x += step) { b.beginPath(); b.arc(x, y, r, 0, TAU); b.fill(); }
    }
  }

  function buildMini() {
    const r = L.rail;
    mini.style.left = r.x + 'px'; mini.style.top = r.y + 'px';
    mini.style.width = r.w + 'px'; mini.style.height = r.h + 'px';
    mini.width = Math.round(r.w * L.dpr); mini.height = Math.round(r.h * L.dpr);
    miniBg = document.createElement('canvas');
    miniBg.width = mini.width; miniBg.height = mini.height;
    const g = miniBg.getContext('2d');
    g.scale(L.dpr, L.dpr);
    g.fillStyle = rgba(C.cabinet, 0.9);
    g.strokeStyle = C.line; g.lineWidth = 1;
    g.beginPath(); g.roundRect ? g.roundRect(0.5, 0.5, r.w - 1, r.h - 1, 8) : g.rect(0.5, 0.5, r.w - 1, r.h - 1);
    g.fill(); g.stroke();
    const kx = (r.w - 6) / MAP.W, ky = (r.h - 6) / MAP.H, X = (x) => 3 + x * kx, Y = (y) => 3 + y * ky;
    for (const sec of MAP.sections) {
      g.fillStyle = rgba(C.ink, 0.05);
      g.fillRect(3, Y(sec.y0), r.w - 6, 1);
    }
    g.lineCap = 'round';
    for (const s of MAP.segs) {
      g.strokeStyle = s.kind === 'shelf' ? C.ramp : C.chromeDark;
      g.lineWidth = s.kind === 'shelf' ? 1.5 : 1.2;
      g.beginPath(); g.moveTo(X(s.ax), Y(s.ay)); g.lineTo(X(s.bx), Y(s.by)); g.stroke();
    }
    for (const rt of MAP.rotors) {
      g.strokeStyle = rgba(C.spinner, 0.8); g.lineWidth = 1;
      g.beginPath(); g.ellipse(X(rt.cx), Y(rt.cy), Math.max(1.5, rt.len * kx), Math.max(1.5, rt.len * ky), 0, 0, TAU); g.stroke();
    }
    for (const c of MAP.circs) {
      if (c.kind !== 'bumper') continue;
      g.fillStyle = C.insert;
      g.beginPath(); g.ellipse(X(c.x), Y(c.y), Math.max(1.5, c.r * kx), Math.max(1.5, c.r * ky), 0, 0, TAU); g.fill();
    }
    g.fillStyle = C.ink;
    g.fillRect(X(MAP.chute.x0), Y(MAP.finishY) - 1, (MAP.chute.x1 - MAP.chute.x0) * kx, 2);
  }

  /* ---------- 스프라이트 ---------- */
  const marbleSprites = new Map(), labelSprites = new Map(), glowSprites = new Map();

  function marbleSprite(color) {
    let sp = marbleSprites.get(color);
    if (sp) return sp;
    const rp = R * L.scale * L.dpr;
    const pad = Math.ceil(rp * 0.45) + 2, size = Math.ceil(rp * 2 + pad * 2);
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const g = cv.getContext('2d'), c = size / 2;
    g.fillStyle = 'rgba(0, 0, 0, 0.4)';
    g.beginPath(); g.ellipse(c + rp * 0.22, c + rp * 0.34, rp * 0.98, rp * 0.9, 0, 0, TAU); g.fill();
    g.fillStyle = color;
    g.beginPath(); g.arc(c, c, rp, 0, TAU); g.fill();
    let gr = g.createRadialGradient(c - rp * 0.2, c - rp * 0.25, rp * 0.2, c, c, rp);
    gr.addColorStop(0, 'rgba(255, 255, 255, 0)'); gr.addColorStop(0.72, 'rgba(0, 0, 0, 0.04)'); gr.addColorStop(1, 'rgba(0, 0, 0, 0.42)');
    g.fillStyle = gr; g.beginPath(); g.arc(c, c, rp, 0, TAU); g.fill();
    gr = g.createRadialGradient(c - rp * 0.38, c - rp * 0.42, 0, c - rp * 0.38, c - rp * 0.42, rp * 0.64);
    gr.addColorStop(0, 'rgba(255, 255, 255, 0.95)'); gr.addColorStop(0.35, 'rgba(255, 255, 255, 0.32)'); gr.addColorStop(1, 'rgba(255, 255, 255, 0)');
    g.fillStyle = gr; g.beginPath(); g.arc(c, c, rp, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(0, 0, 0, 0.55)'; g.lineWidth = Math.max(1, L.dpr * 0.9);
    g.beginPath(); g.arc(c, c, rp - 0.5, 0, TAU); g.stroke();
    sp = { cv, half: size / 2 / (L.scale * L.dpr) };
    marbleSprites.set(color, sp);
    return sp;
  }

  function labelSprite(name) {
    let sp = labelSprites.get(name);
    if (sp) return sp;
    const px = L.label, chars = Array.from(name);
    const txt = chars.length > 8 ? chars.slice(0, 7).join('') + '…' : name;
    const cv = document.createElement('canvas'), g = cv.getContext('2d');
    g.font = `600 ${px}px ${FONT_BODY}`;
    const w = Math.ceil(g.measureText(txt).width) + 8, h = px + 8;
    cv.width = Math.ceil(w * L.dpr); cv.height = Math.ceil(h * L.dpr);
    g.scale(L.dpr, L.dpr);
    g.font = `600 ${px}px ${FONT_BODY}`; g.textBaseline = 'middle'; g.lineJoin = 'round';
    g.strokeStyle = rgba(C.cabinet, 0.92); g.lineWidth = 3.4; g.strokeText(txt, 4, h / 2 + 0.5);
    g.fillStyle = C.ink; g.fillText(txt, 4, h / 2 + 0.5);
    sp = { cv, w, h };
    labelSprites.set(name, sp);
    return sp;
  }

  function glow(color) {
    let cv = glowSprites.get(color);
    if (cv) return cv;
    cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const g = cv.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, rgba(color, 0.9)); gr.addColorStop(0.35, rgba(color, 0.42)); gr.addColorStop(1, rgba(color, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    glowSprites.set(color, cv);
    return cv;
  }

  /* 움직이지 않는 코스 모양은 한 번만 경로로 만들어 둔다 */
  let P = buildPaths();
  function buildPaths() {
    const walls = new Path2D(), shelves = new Path2D(), pegs = new Path2D(), pegHi = new Path2D(), nubs = new Path2D();
    for (const s of MAP.segs) {
      const p = s.kind === 'shelf' ? shelves : walls;
      p.moveTo(s.ax, s.ay); p.lineTo(s.bx, s.by);
    }
    for (const c of MAP.circs) {
      if (c.kind === 'peg') {
        pegs.moveTo(c.x + c.r, c.y); pegs.arc(c.x, c.y, c.r, 0, TAU);
        pegHi.moveTo(c.x - 1.6 + 1.8, c.y - 2); pegHi.arc(c.x - 1.6, c.y - 2, 1.8, 0, TAU);
      } else if (c.kind === 'nub') {
        nubs.moveTo(c.x + c.r, c.y); nubs.arc(c.x, c.y, c.r, 0, TAU);
      }
    }
    return { walls, shelves, pegs, pegHi, nubs };
  }

  /* ---------- 입력 → 구슬 ---------- */
  function readEntries() {
    const { items } = E.parseEntries(ui.names.value);
    const colorOf = new Map(), list = [];
    for (const it of items) {
      if (!colorOf.has(it.name)) colorOf.set(it.name, colorFor(colorOf.size));
      for (let k = 0; k < it.count; k++) list.push({ name: it.name, color: colorOf.get(it.name), key: it.name });
    }
    return { list, people: colorOf.size };
  }

  function syncPreview() {
    const { list, people } = readEntries();
    S.entries = list; S.people = people;
    const n = Math.min(list.length, E.MAX_MARBLES);
    const slots = E.spawnSlots(MAP, Math.max(1, n));
    S.topSlotY = slots[slots.length - 1].y;
    S.rows = 1 + Math.round((slots[0].y - S.topSlotY) / 24);
    const prev = S.preview;
    S.preview = list.slice(0, n).map((e, i) => {
      const p = prev[i], s = slots[i];
      return {
        name: e.name, color: e.color, key: e.key,
        x: p ? p.x : s.x, y: p ? p.y : s.y - 90 - Math.random() * 60, vy: p ? p.vy : 0,
        tx: s.x, ty: s.y, fx: 0, fy: 0,
      };
    });
    validate();
    if (S.phase === 'setup') DMD.set(idleContent(), true);
  }

  function validate() {
    const total = S.entries.length;
    let msg = '';
    if (total > E.MAX_MARBLES) msg = `구슬은 한 번에 ${E.MAX_MARBLES}개까지 넣을 수 있어요. 지금 ${total}개예요.`;
    else if (total === 1) msg = '구슬이 2개 이상 있어야 시작할 수 있어요.';
    else if (S.mode === 'rank' && total >= 2 && S.rank > total) msg = `구슬이 ${total}개라 ${total}등까지만 정할 수 있어요.`;
    ui.err.textContent = msg;
    ui.err.hidden = !msg;
    const ok = total >= 2 && !msg;
    ui.start.disabled = !ok;
    ui.summary.innerHTML = total
      ? `구슬 <b>${total}</b>개 · <b>${S.people}</b>명 · <b>${esc(modeName())}</b> 당첨`
      : '이름을 넣으면 구슬이 생겨요';
    ui.rankNum.max = String(Math.max(1, total));
    ui.sample.hidden = ui.names.value.trim() !== EXAMPLE;
    return ok;
  }

  function save() {
    store.set('names', ui.names.value);
    store.set('mode', S.mode);
    store.set('rank', S.rank);
    store.set('sound', S.sound);
    store.set('skills', S.skills);
    store.set('cats', S.cats);
  }

  /* ---------- 진행 단계 ---------- */
  function setPhaseUI() {
    const p = S.phase, live = p === 'race' || p === 'done';
    ui.setup.hidden = p !== 'setup';
    ui.controls.hidden = p === 'setup' || p === 'edit';
    ui.edTools.hidden = p !== 'edit';
    ui.edPanel.hidden = p !== 'edit';
    ui.board.hidden = !(L.wide && live);
    ui.ticker.hidden = L.wide || !live;
    ui.shake.disabled = p !== 'race';
    if (p === 'setup') DMD.set(idleContent(), true);
    if (p === 'edit') DMD.set({ kind: 'msg', text: '코스 편집 중  ·  도구를 골라 눌러서 놓아 보세요' }, true);
    layout();
  }

  async function keepAwake(on) {
    try {
      if (on && !S.wake && navigator.wakeLock) {
        S.wake = await navigator.wakeLock.request('screen');
        S.wake.addEventListener && S.wake.addEventListener('release', () => { S.wake = null; });
      } else if (!on && S.wake) {
        const w = S.wake; S.wake = null; await w.release();
      }
    } catch (e) { S.wake = null; }
  }

  function startRace() {
    if (!validate()) return;
    Sound.unlock();
    keepAwake(true);
    clearTimeout(S.resultTimer);
    ui.result.hidden = true;
    ui.copySlot.replaceChildren();
    const n = S.preview.length;
    const perm = shuffled(n);
    const slots = E.spawnSlots(MAP, n);
    for (let k = 0; k < n; k++) {
      const p = S.preview[perm[k]];
      p.fx = p.x; p.fy = p.y; p.tx = slots[k].x; p.ty = slots[k].y; p.vy = 0;
    }
    S.cd = { t: 0, perm, stage: -1 };
    S.phase = 'countdown';
    S.race = null; S.winner = null; S.gate = 0;
    S.slow = 1; S.slowUsed = 0; S.slowUntil = 0; S.acc = 0; S.manualUntil = 0;
    S.particles.length = 0; S.confetti.length = 0; S.rings.length = 0;
    ui.ticker.replaceChildren();
    setPhaseUI();
    Sound.shuffle();
    DMD.set({ kind: 'msg', text: '자리 섞는 중' }, true);
    ui.live.textContent = '출발 자리를 섞고 있어요';
  }

  function updateCountdown(dt) {
    const cd = S.cd, SH = 0.75;
    cd.t += dt;
    const e = easeInOut(clamp(cd.t / SH, 0, 1));
    for (const p of S.preview) {
      p.x = lerp(p.fx, p.tx, e);
      p.y = lerp(p.fy, p.ty, e) - Math.sin(e * Math.PI) * 34;
    }
    const marks = [SH + 0.05, SH + 0.6, SH + 1.15, SH + 1.7];
    let stage = -1;
    for (let i = 0; i < marks.length; i++) if (cd.t >= marks[i]) stage = i;
    if (stage !== cd.stage) {
      cd.stage = stage;
      if (stage >= 0 && stage <= 2) { DMD.set({ kind: 'count', n: 3 - stage }, true); Sound.count(false); }
      if (stage === 3) { release(); return; }
    }
    S.gate = clamp((cd.t - (SH + 1.45)) / 0.25, 0, 1);
  }

  function release() {
    const perm = S.cd.perm, entries = [];
    for (let k = 0; k < perm.length; k++) {
      const p = S.preview[perm[k]];
      entries.push({ name: p.name, color: p.color, key: p.key });
    }
    S.race = new E.Race(MAP, entries, { mode: S.mode, rank: S.rank, seed: rand32(), skills: S.skills, cats: S.cats });
    S.race.release();
    S.phase = 'race'; S.cd = null; S.gate = 1; S.lastUi = 0;
    setPhaseUI();
    Sound.count(true);
    DMD.set(raceContent(), true);
    DMD.flash('출발!', 0.7);
    ui.boardGoal.innerHTML = `<b>${esc(modeName())}</b>으로 들어온 구슬이 당첨 · 구슬 ${S.race.N}개`;
    ui.live.textContent = '출발했어요';
  }

  function goSetup() {
    clearTimeout(S.resultTimer);
    S.phase = 'setup'; S.race = null; S.winner = null; S.cd = null; S.manualUntil = 0;
    S.confetti.length = 0;
    ui.result.hidden = true;
    ui.copySlot.replaceChildren();
    keepAwake(false);
    S.preview = [];
    syncPreview();
    setPhaseUI();
  }

  /* ---------- 레이스 진행 ---------- */
  function updateRace(dt, now) {
    const race = S.race;
    // 당첨이 갈리기 직전 접전이면 잠깐 느리게 (조건이 풀려도 1초는 유지)
    let target = 1;
    if (S.phase === 'done') target = 0.6;
    else if (race.cat && race.cat.t < 1.15) target = 0.6;   // 고양이 장면은 살짝 느리게
    else if (!reduceMotion && S.slowUsed < 5) {
      if (race.decisive()) S.slowUntil = now + 1000;
      if (now < S.slowUntil) target = 0.4;
    }
    // 속도를 서서히 바꾸고, 매 프레임 실제 흐른 시간만큼만 진행해서 끊김 없이
    S.slow += (target - S.slow) * (1 - Math.exp(-dt * 3));
    if (S.phase === 'race' && S.slow < 0.9) S.slowUsed += dt;
    let left = (dt * S.speed * S.slow) / STEP, n = 0;
    while (left > 1e-4 && n < 10) { const f = Math.min(1, left); race.step(f); left -= f; n++; }
    handleEvents(race, now);
  }

  function viewRange() {
    return [S.camY - L.focusY / L.scale - 30, S.camY + (L.h - L.focusY) / L.scale + 30];
  }

  function handleEvents(race, now) {
    const evs = race.events, [y0, y1] = viewRange();
    for (let i = 0; i < evs.length; i++) {
      const ev = evs[i];
      if (ev.type === 'hit') { if (ev.y > y0 && ev.y < y1) Sound.tick(ev.v); }
      else if (ev.type === 'bump') {
        if (ev.y > y0 && ev.y < y1) { Sound.bump(); sparks(ev.x, ev.y, ev.kind === 'bumper' ? C.insert : C.dmd, reduceMotion ? 2 : 5); }
      } else if (ev.type === 'skill') onSkill(ev, y0, y1, now);
      else if (ev.type === 'cat') onCat(ev, now);
      else if (ev.type === 'catgrab') onCatGrab(ev, now);
      else if (ev.type === 'catdrop') {
        S.catFollow = { m: ev.m, until: now + 900 };
        if (ev.y > y0 && ev.y < y1) { S.rings.push({ x: ev.x, y: ev.y, color: C.fur, t: 0 }); sparks(ev.x, ev.y, C.fur, 8); }
      }
      else if (ev.type === 'finish') onFinish(ev.m);
      else if (ev.type === 'winner') onWinner(ev.m, now);
    }
    evs.length = 0;
  }

  function onSkill(ev, y0, y1, now) {
    if (ev.y < y0 || ev.y > y1) return;
    S.rings.push({ x: ev.x, y: ev.y, color: ev.m.color, t: 0 });
    if (S.rings.length > 30) S.rings.shift();
    sparks(ev.x, ev.y, ev.m.color, reduceMotion ? 3 : 10);
    Sound.pop();
    const focus = currentFocus();
    if (!S.winner && now - S.lastSkillMsg > 1500 && (ev.m === focus || S.race.N <= 12)) {
      S.lastSkillMsg = now;
      DMD.flash(`펑! ${ev.m.name}`, 0.8);
    }
  }

  function onCat(ev, now) {
    if (!S.winner) { DMD.flash('고양이 출몰!', 0.9); S.lastSkillMsg = now; }
  }
  function onCatGrab(ev, now) {
    Sound.meow();
    if (!S.winner) { DMD.flash(`냥! ${ev.m.name} 납치`, 1.3); S.lastSkillMsg = now; }
  }

  function onFinish(m) {
    sparks(m.x, MAP.finishY, m.color, reduceMotion ? 5 : 16);
    Sound.finish();
    const race = S.race, T = race.targetRank;
    if (!S.winner && (race.N <= 24 || m.rank <= 3 || Math.abs(m.rank - T) <= 1)) DMD.flash(`${m.rank}등 ${m.name}`, 1.0);
    S.lastUi = 0;
  }

  function onWinner(m, now) {
    S.winner = m; S.phase = 'done';
    Sound.win();
    DMD.set(raceContent(), true);
    if (!reduceMotion) burstConfetti();
    ui.live.textContent = `${modeName()} 당첨: ${m.name}`;
    ui.shake.disabled = true;
    S.lastUi = 0;
    S.resultTimer = setTimeout(showResult, 1300);
  }

  function burstConfetti() {
    const colors = Array.from(new Set(S.race.marbles.map((m) => m.color))).slice(0, 12);
    colors.push(C.dmd, C.insert);
    for (let i = 0; i < 150; i++) {
      S.confetti.push({
        x: Math.random() * L.w, y: -20 - Math.random() * L.h * 0.5,
        vx: (Math.random() - 0.5) * 90, vy: 70 + Math.random() * 140,
        rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 9,
        w: 5 + Math.random() * 6, h: 3 + Math.random() * 4,
        color: colors[i % colors.length], t: 0, life: 4 + Math.random() * 2,
      });
    }
  }

  function sparks(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = 80 + Math.random() * 260;
      S.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, t: 0,
        life: 0.45 + Math.random() * 0.4, color, r: 1.6 + Math.random() * 2.2 });
    }
    if (S.particles.length > 500) S.particles.splice(0, S.particles.length - 500);
  }

  function updateParticles(dt) {
    const ps = S.particles;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t > p.life) ps.splice(i, 1);
    }
    for (let i = S.rings.length - 1; i >= 0; i--) { S.rings[i].t += dt; if (S.rings[i].t > 0.45) S.rings.splice(i, 1); }
    const cf = S.confetti;
    for (let i = cf.length - 1; i >= 0; i--) {
      const c = cf[i];
      c.t += dt; c.vy += 60 * dt; c.vx += Math.sin(c.t * 3 + i) * 20 * dt;
      c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
      if (c.t > c.life || c.y > L.h + 30) cf.splice(i, 1);
    }
  }

  /* ---------- 결과 ---------- */
  function showResult() {
    if (S.phase !== 'done' || !S.winner) return;
    const m = S.winner, race = S.race;
    ui.rEyebrow.textContent = `${modeName()} 당첨`;
    const ball = document.createElement('span');
    ball.className = 'ball'; ball.style.setProperty('--c', m.color);
    const nm = document.createElement('span'); nm.textContent = m.name;
    ui.rName.replaceChildren(ball, nm);
    ui.rMeta.textContent = m.finished
      ? `구슬 ${race.N}개 중 ${m.rank}번째로 도착 · ${fmtTime(m.time)}`
      : `구슬 ${race.N}개 중 마지막까지 남은 구슬 · ${fmtTime(race.winTime)}`;
    renderResultList();
    ui.copySlot.replaceChildren();
    ui.result.hidden = false;
    try { ui.again.focus({ preventScroll: true }); } catch (e) { /* 포커스 실패는 무시 */ }
  }

  function rowHTML(m, rank, extra, live) {
    const cls = ['row', m.finished ? 'done' : 'racing'];
    if (extra) cls.push(extra);
    const tm = m === S.winner ? '당첨' : m.finished ? fmtTime(m.time) : extra === 'target' ? '당첨 자리' : (live ? '' : '도착 전');
    return `<li class="${cls.join(' ')}"><span class="rk">${rank}</span><span class="dot" style="--c:${m.color}"></span>` +
      `<span class="nm">${esc(m.name)}</span><span class="tm">${tm}</span></li>`;
  }

  function renderResultList() {
    if (!S.race) return;
    ui.rList.innerHTML = S.race.standings().map((m, i) => rowHTML(m, i + 1, m === S.winner ? 'won' : '')).join('');
  }

  function resultText() {
    const race = S.race, m = S.winner;
    const lines = [`핀볼 뽑기 결과 · ${modeName()} 당첨`, `당첨: ${m.name}`, ''];
    race.standings().forEach((x, i) => {
      lines.push(`${i + 1}. ${x.name}${x.finished ? ` (${fmtTime(x.time)})` : ' (도착 전)'}`);
    });
    return lines.join('\n');
  }

  /* ---------- 순위판 / 도착 알림 ---------- */
  function renderBoard() {
    const race = S.race;
    if (!race || ui.board.hidden) return;
    const st = race.standings(), T = race.targetRank;
    let html = '', targetIdx = -1;
    for (let i = 0; i < st.length; i++) {
      const m = st[i];
      const extra = m === S.winner ? 'won' : (!S.winner && i + 1 === T) ? 'target' : '';
      if (extra) targetIdx = i;
      html += rowHTML(m, i + 1, extra, true);
    }
    ui.boardList.innerHTML = html;
    ui.boardCount.textContent = `${race.finished.length}/${race.N} 도착`;
    if (targetIdx >= 0 && performance.now() > (ui.boardList._userScroll || 0)) {
      const row = ui.boardList.children[targetIdx];
      if (row) ui.boardList.scrollTop = row.offsetTop - ui.boardList.clientHeight / 2;
    }
  }

  function renderTicker() {
    const race = S.race;
    if (!race || ui.ticker.hidden) return;
    const recent = race.finished.slice(-3).reverse();
    const T = race.targetRank;
    ui.ticker.innerHTML = recent.map((m) =>
      `<li class="${m.rank === T ? 'target' : ''}"><span class="rk">${m.rank}</span><span class="dot" style="--c:${m.color}"></span>` +
      `<span class="nm">${esc(m.name)}</span></li>`).join('');
  }

  /* ---------- 카메라 ---------- */
  function currentFocus() {
    if (!S.race) return null;
    return S.winner || S.race.contender();
  }

  function clampCam() {
    const s = L.scale;
    const lo = -30 + (L.focusY - L.top) / s;
    const hi = MAP.H + 10 - (L.h - L.bottom - L.focusY) / s;
    S.camY = lo > hi ? (lo + hi) / 2 : clamp(S.camY, lo, hi);
  }

  function updateCamera(dt, now) {
    let target = null;
    if (S.phase === 'edit') { clampCam(); ui.follow.hidden = true; return; }
    if (S.phase === 'setup' || S.phase === 'countdown') target = (S.topSlotY + MAP.gateY + 100) / 2;
    else {
      const c = currentFocus();
      if (c) target = (c.finished ? MAP.finishY : c.y) + (c.finished ? 0 : clamp(c.vy * 0.12, -30, 110));
    }
    // 고양이 손이 나오면 잠깐 그쪽을 비추고(낚아채기 → 다시 떨어뜨리는 곳), 끝나면 당첨 후보로 돌아감
    let rate = S.phase === 'race' ? 3.2 : 4.5;
    const cat = S.race && !S.winner && S.race.cat;
    if (cat) { target = cat.t < 1.15 ? cat.gy : cat.dropY; rate = 5; }
    else if (S.catFollow && now < S.catFollow.until && !S.winner) { target = S.catFollow.m.y; rate = 5; }
    const manual = now < S.manualUntil;
    if (!manual && target != null) {
      S.camY += (target - S.camY) * (1 - Math.exp(-dt * rate));
    }
    clampCam();
    if (ui.follow.hidden === manual) {
      ui.follow.hidden = !manual;
      ui.follow.textContent = S.phase === 'setup' ? '출발선 보기' : '당첨 자리 따라가기';
    }
  }

  /* ---------- 그리기 ---------- */
  const sx = (x) => L.ox + x * L.scale;
  const sy = (y) => L.focusY + (y - S.camY) * L.scale;

  function circle(x, y, r) { fx.beginPath(); fx.arc(x, y, r, 0, TAU); }

  function drawPlate(y0, y1) {
    const top = Math.max(-40, y0), bot = Math.min(MAP.H + 30, y1);
    if (bot <= top) return;
    fx.fillStyle = C.field;
    fx.fillRect(4, top, MAP.W - 8, bot - top);
    // 출발 대기칸
    if (y0 < MAP.gateY) { fx.fillStyle = rgba(C.cabinet, 0.45); fx.fillRect(20, 8, MAP.W - 40, MAP.gateY - 8); }
    MAP.sections.forEach((sec, i) => {
      if (sec.y1 < y0 || sec.y0 > y1) return;
      if (i % 2 === 1) { fx.fillStyle = C.band; fx.fillRect(20, sec.y0, MAP.W - 40, sec.y1 - sec.y0); }
      fx.fillStyle = rgba(C.ink, 0.055);
      fx.font = `78px ${FONT_DISPLAY}`; fx.textBaseline = 'top'; fx.textAlign = 'left';
      fx.fillText(sec.label, 34, sec.y0 + 14);
    });
  }

  function drawInserts(t, y0, y1) {
    MAP.inserts.forEach((p, i) => {
      if (p.y < y0 - 20 || p.y > y1 + 20) return;
      const on = 0.2 + 0.8 * Math.max(0, Math.sin(t * 5 - i * 0.9));
      if (on > 0.75) {
        fx.globalCompositeOperation = 'lighter'; fx.globalAlpha = (on - 0.75) * 2;
        fx.drawImage(glow(C.insert), p.x - 22, p.y - 22, 44, 44);
        fx.globalCompositeOperation = 'source-over'; fx.globalAlpha = 1;
      }
      fx.fillStyle = rgba(C.insert, 0.14 + on * 0.6);
      fx.beginPath(); fx.moveTo(p.x - 11, p.y - 7); fx.lineTo(p.x + 11, p.y - 7); fx.lineTo(p.x, p.y + 9); fx.closePath(); fx.fill();
    });
  }

  function drawFinish(y0, y1) {
    const y = MAP.finishY;
    if (y < y0 - 40 || y > y1 + 80) return;
    const x0 = MAP.chute.x0 + 8, x1 = MAP.chute.x1 - 8, sq = 7;
    const gr = fx.createLinearGradient(0, y, 0, y + 80);
    gr.addColorStop(0, rgba(C.dmd, 0.28)); gr.addColorStop(1, rgba(C.dmd, 0));
    fx.fillStyle = gr; fx.fillRect(x0, y, x1 - x0, 80);
    for (let i = 0, x = x0; x < x1; i++, x += sq) {
      for (let j = 0; j < 2; j++) {
        fx.fillStyle = (i + j) % 2 ? C.ink : C.cabinet;
        fx.fillRect(x, y - sq * 2 + j * sq, Math.min(sq, x1 - x), sq);
      }
    }
    fx.fillStyle = rgba(C.ink, 0.75);
    fx.font = `17px ${FONT_DISPLAY}`; fx.textAlign = 'center'; fx.textBaseline = 'bottom';
    fx.fillText('결승선', (x0 + x1) / 2, y - sq * 2 - 6);
  }

  function drawStatics(y0, y1) {
    fx.lineCap = 'round'; fx.lineJoin = 'round';
    fx.save(); fx.translate(3, 4);
    fx.strokeStyle = 'rgba(0, 0, 0, 0.42)'; fx.lineWidth = 16; fx.stroke(P.walls);
    fx.lineWidth = 14; fx.stroke(P.shelves);
    fx.fillStyle = 'rgba(0, 0, 0, 0.42)'; fx.fill(P.pegs); fx.fill(P.nubs);
    fx.restore();

    fx.strokeStyle = C.chromeDark; fx.lineWidth = 16; fx.stroke(P.walls);
    fx.strokeStyle = C.chrome; fx.lineWidth = 11; fx.stroke(P.walls);
    fx.save(); fx.translate(-1.6, -1.6);
    fx.strokeStyle = 'rgba(255, 255, 255, 0.75)'; fx.lineWidth = 2.4; fx.stroke(P.walls);
    fx.restore();

    fx.strokeStyle = rgba(C.ramp, 0.5); fx.lineWidth = 14; fx.stroke(P.shelves);
    fx.strokeStyle = C.ramp; fx.lineWidth = 8; fx.stroke(P.shelves);
    fx.save(); fx.translate(0, -2.4);
    fx.strokeStyle = 'rgba(255, 255, 255, 0.45)'; fx.lineWidth = 2; fx.stroke(P.shelves);
    fx.restore();

    fx.fillStyle = C.chromeDark; fx.fill(P.nubs);
    fx.strokeStyle = C.chrome; fx.lineWidth = 2; fx.stroke(P.nubs);
    fx.fillStyle = C.brass; fx.fill(P.pegs);
    fx.strokeStyle = 'rgba(0, 0, 0, 0.55)'; fx.lineWidth = 1.2; fx.stroke(P.pegs);
    fx.fillStyle = 'rgba(255, 255, 255, 0.7)'; fx.fill(P.pegHi);

    fx.globalCompositeOperation = 'lighter';
    const g = glow(C.dmd);
    for (const c of MAP.circs) {
      if (c.flash < 0.04 || c.kick || c.y < y0 || c.y > y1) continue;
      const s = 8 + 22 * c.flash;
      fx.globalAlpha = Math.min(1, c.flash * 1.2);
      fx.drawImage(g, c.x - s, c.y - s, s * 2, s * 2);
    }
    fx.globalAlpha = 1; fx.globalCompositeOperation = 'source-over';
  }

  function drawBumpers(y0, y1) {
    for (const c of MAP.circs) {
      if (!c.kick || c.y + 40 < y0 || c.y - 40 > y1) continue;
      const f = c.flash, r = c.r * (1 + f * 0.08), isB = c.kind === 'bumper';
      const base = isB ? C.insert : C.dmd;
      fx.fillStyle = 'rgba(0, 0, 0, 0.45)'; circle(c.x + 3, c.y + 4, r + 5); fx.fill();
      fx.fillStyle = C.cabinet; circle(c.x, c.y, r + 5); fx.fill();
      fx.strokeStyle = rgba(base, 0.75); fx.lineWidth = 2; fx.stroke();
      const g = fx.createRadialGradient(c.x - r * 0.35, c.y - r * 0.4, r * 0.1, c.x, c.y, r);
      g.addColorStop(0, f > 0.08 ? C.ink : (isB ? C.insertHi : rgba(C.ink, 0.9)));
      g.addColorStop(0.55, base);
      g.addColorStop(1, isB ? C.insertLo : rgba(C.cabinet, 0.85));
      fx.fillStyle = g; circle(c.x, c.y, r); fx.fill();
      fx.strokeStyle = rgba(C.ink, 0.85); fx.lineWidth = 2.2; circle(c.x, c.y, r * 0.62); fx.stroke();
      fx.fillStyle = C.ink; circle(c.x, c.y, r * 0.2); fx.fill();
      if (f > 0.04) {
        fx.globalCompositeOperation = 'lighter'; fx.globalAlpha = Math.min(1, f);
        const s = r * (1.6 + f * 1.6);
        fx.drawImage(glow(base), c.x - s, c.y - s, s * 2, s * 2);
        fx.globalCompositeOperation = 'source-over'; fx.globalAlpha = 1;
      }
    }
  }

  function drawRotors(y0, y1) {
    fx.lineCap = 'round';
    for (const r of MAP.rotors) {
      if (r.cy + r.len + 12 < y0 || r.cy - r.len - 12 > y1) continue;
      const path = new Path2D();
      for (let k = 0; k < r.arms; k++) {
        const a = r.angle + (k * TAU) / r.arms;
        path.moveTo(0, 0); path.lineTo(Math.cos(a) * r.len, Math.sin(a) * r.len);
      }
      fx.save(); fx.translate(r.cx + 3, r.cy + 4);
      fx.strokeStyle = 'rgba(0, 0, 0, 0.4)'; fx.lineWidth = 14; fx.stroke(path);
      fx.restore();
      fx.save(); fx.translate(r.cx, r.cy);
      fx.strokeStyle = rgba(C.spinner, 0.5); fx.lineWidth = 15; fx.stroke(path);
      fx.strokeStyle = C.spinner; fx.lineWidth = 9; fx.stroke(path);
      fx.strokeStyle = 'rgba(255, 255, 255, 0.42)'; fx.lineWidth = 2.5; fx.stroke(path);
      fx.fillStyle = C.chromeDark; circle(0, 0, 10); fx.fill();
      fx.fillStyle = C.chrome; circle(0, 0, 7.5); fx.fill();
      fx.fillStyle = C.chromeDark; circle(0, 0, 2.5); fx.fill();
      fx.restore();
    }
  }

  function drawGate(open) {
    const half = ((MAP.W - 40) / 2) * (1 - open);
    if (half < 1) return;
    const y = MAP.gateY;
    fx.lineCap = 'round';
    const seg = (a, b) => { fx.beginPath(); fx.moveTo(a, y); fx.lineTo(b, y); fx.stroke(); };
    fx.strokeStyle = C.chromeDark; fx.lineWidth = 9;
    seg(20, 20 + half); seg(MAP.W - 20 - half, MAP.W - 20);
    fx.strokeStyle = C.chrome; fx.lineWidth = 5;
    seg(20, 20 + half); seg(MAP.W - 20 - half, MAP.W - 20);
  }

  function marblesForDraw() {
    if (S.phase === 'edit') return [];
    if (S.phase === 'setup' || S.phase === 'countdown') return S.preview;
    return S.race ? S.race.active : [];
  }

  function drawMarbles(list, y0, y1) {
    for (let i = 0; i < list.length; i++) {
      const m = list[i];
      if (m.y < y0 || m.y > y1) continue;
      const sp = marbleSprite(m.color);
      fx.drawImage(sp.cv, m.x - sp.half, m.y - sp.half, sp.half * 2, sp.half * 2);
    }
  }

  function drawRings() {
    for (const r of S.rings) {
      const k = r.t / 0.45, rad = 14 + (E.SKILL_RADIUS - 14) * (1 - Math.pow(1 - k, 3));
      fx.globalAlpha = Math.max(0, 1 - k);
      fx.fillStyle = rgba(r.color, 0.18); circle(r.x, r.y, rad); fx.fill();
      fx.strokeStyle = r.color; fx.lineWidth = 4 * (1 - k) + 1; fx.stroke();
      fx.strokeStyle = C.ink; fx.lineWidth = 1.5; circle(r.x, r.y, rad * 0.7); fx.stroke();
    }
    fx.globalAlpha = 1;
  }

  /* 고양이 앞발: 벽 밖에서 팔이 뻗어 나와 구슬을 쥐고 간다 */
  function drawCat() {
    const c = S.race && S.race.cat;
    if (!c || c.t >= 1.15) return;
    const ang = Math.atan2(c.py - c.oy, c.px - c.ox);
    fx.lineCap = 'round';
    fx.strokeStyle = 'rgba(0, 0, 0, 0.35)'; fx.lineWidth = 40;
    fx.beginPath(); fx.moveTo(c.ox + 4, c.oy + 6); fx.lineTo(c.px + 4, c.py + 6); fx.stroke();
    fx.strokeStyle = C.furDark; fx.lineWidth = 38;
    fx.beginPath(); fx.moveTo(c.ox, c.oy); fx.lineTo(c.px, c.py); fx.stroke();
    fx.strokeStyle = C.fur; fx.lineWidth = 32; fx.stroke();
    // 줄무늬
    fx.save(); fx.translate(c.px, c.py); fx.rotate(ang);
    fx.strokeStyle = C.furDark; fx.lineWidth = 5;
    const len = Math.hypot(c.px - c.ox, c.py - c.oy);
    for (let d = 40; d < len - 10; d += 26) { fx.beginPath(); fx.moveTo(-d, -12); fx.lineTo(-d - 6, 12); fx.stroke(); }
    // 발바닥
    fx.fillStyle = C.fur; circle(6, 0, 25); fx.fill();
    fx.strokeStyle = C.furDark; fx.lineWidth = 2.5; fx.stroke();
    const grab = c.t > 0.45;
    fx.fillStyle = C.bean;
    for (const [bx, by] of [[22, -15], [27, -4], [27, 7], [22, 17]]) { circle(bx - (grab ? 6 : 0), by * (grab ? 0.8 : 1), 5); fx.fill(); }
    fx.beginPath(); fx.ellipse(6, 1, 9, 11, 0, 0, TAU); fx.fill();
    fx.restore();
  }

  function drawParticles() {
    for (const p of S.particles) {
      fx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      fx.fillStyle = p.color; circle(p.x, p.y, p.r); fx.fill();
    }
    fx.globalAlpha = 1;
  }

  function drawLabels(list, focus) {
    const rs = R * L.scale;
    const top = L.top - 10, bot = L.h + 10;
    // 출발 전 한 줄로 서 있을 때는 이름을 구슬 위에 가운데 정렬
    const waiting = S.phase === 'setup' || S.phase === 'countdown';
    // 여러 줄로 빽빽하게 서 있을 때는 이름이 겹치기만 하므로 생략 (이름은 입력칸에 보임)
    if (waiting && S.rows > 1) return;
    const above = waiting;
    let visible = [];
    for (const m of list) { const y = sy(m.y); if (y > top && y < bot) visible.push(m); }
    if (visible.length > 40) {
      const ranked = visible.slice().sort((a, b) => b.y - a.y).slice(0, 5);
      if (focus && !ranked.includes(focus) && visible.includes(focus)) ranked.push(focus);
      visible = ranked;
    }
    for (const m of visible) {
      const x = sx(m.x), y = sy(m.y), sp = labelSprite(m.name);
      if (above) { fx.drawImage(sp.cv, x - sp.w / 2, y - rs - sp.h + 1, sp.w, sp.h); continue; }
      const gap = m === focus ? 9 : 2;
      let lx = x + rs + gap;
      if (lx + sp.w > L.stageR + 6) lx = x - rs - gap - sp.w;
      fx.drawImage(sp.cv, lx, y - sp.h / 2, sp.w, sp.h);
    }
  }

  function drawFocus(m, t) {
    if (!m || m.finished || m.hidden) return;
    const x = sx(m.x), y = sy(m.y), rs = R * L.scale, won = !!S.winner;
    const pulse = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(t * 8);
    const col = won ? C.insert : C.dmd;
    fx.strokeStyle = col; fx.lineWidth = 2;
    circle(x, y, rs + 4 + pulse * 2); fx.stroke();
    const py = y - rs - 9 - pulse * 2;
    fx.fillStyle = col;
    fx.beginPath(); fx.moveTo(x - 6, py - 8); fx.lineTo(x + 6, py - 8); fx.lineTo(x, py); fx.closePath(); fx.fill();
  }

  function drawConfetti() {
    for (const c of S.confetti) {
      fx.save();
      fx.globalAlpha = Math.min(1, (c.life - c.t) * 1.5);
      fx.translate(c.x, c.y); fx.rotate(c.rot);
      fx.fillStyle = c.color; fx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      fx.restore();
    }
  }

  function drawMini(list, focus) {
    const r = L.rail;
    if (!r || !miniBg) return;
    mx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    mx.clearRect(0, 0, r.w, r.h);
    mx.drawImage(miniBg, 0, 0, r.w, r.h);
    const kx = (r.w - 6) / MAP.W, ky = (r.h - 6) / MAP.H;
    const v0 = S.camY - (L.focusY - L.top) / L.scale, v1 = S.camY + (L.h - L.bottom - L.focusY) / L.scale;
    mx.fillStyle = rgba(C.ink, 0.08); mx.strokeStyle = rgba(C.ink, 0.55); mx.lineWidth = 1;
    const vy = 3 + Math.max(0, v0) * ky, vh = Math.max(4, (Math.min(MAP.H, v1) - Math.max(0, v0)) * ky);
    mx.fillRect(1.5, vy, r.w - 3, vh); mx.strokeRect(1.5, vy, r.w - 3, vh);
    for (let i = 0; i < list.length; i++) {
      const m = list[i];
      mx.fillStyle = m.color;
      mx.fillRect(3 + m.x * kx - 1.5, 3 + m.y * ky - 1.5, 3, 3);
    }
    if (focus && !focus.finished) {
      mx.strokeStyle = S.winner ? C.insert : C.dmd; mx.lineWidth = 1.5;
      mx.beginPath(); mx.arc(3 + focus.x * kx, 3 + focus.y * ky, 4, 0, TAU); mx.stroke();
    }
  }

  function render(now) {
    const t = now / 1000, s = L.scale;
    fx.setTransform(1, 0, 0, 1, 0, 0);
    if (backdrop) fx.drawImage(backdrop, 0, 0);
    else { fx.fillStyle = C.cabinet; fx.fillRect(0, 0, field.width, field.height); }
    let shx = 0, shy = 0;
    if (S.shakeT > 0) { const a = S.shakeT * 22; shx = (Math.random() - 0.5) * a; shy = (Math.random() - 0.5) * a; }
    fx.setTransform(L.dpr * s, 0, 0, L.dpr * s, L.dpr * (L.ox + shx), L.dpr * (L.focusY - S.camY * s + shy));
    const y0 = S.camY - L.focusY / s - 60, y1 = S.camY + (L.h - L.focusY) / s + 60;
    drawPlate(y0, y1);
    drawInserts(t, y0, y1);
    drawFinish(y0, y1);
    drawStatics(y0, y1);
    drawBumpers(y0, y1);
    drawRotors(y0, y1);
    drawGate(S.phase === 'setup' || S.phase === 'edit' ? 0 : S.gate);
    if (S.phase === 'edit') Editor.draw(y0, y1, t);
    const list = marblesForDraw();
    drawRings();
    drawMarbles(list, y0, y1);
    if (S.race && S.race.cat) {
      drawCat();
      const held = S.race.held.filter((m) => !m.hidden);
      drawMarbles(held, y0, y1);
    }
    drawParticles();
    fx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    const focus = currentFocus();
    drawLabels(list, focus);
    drawFocus(focus, t);
    if (vignette) fx.drawImage(vignette, 0, 0, L.w, L.h);
    drawConfetti();
    drawMini(list, focus);
    DMD.draw(now);
  }

  /* ---------- 코스 (기본 코스 + 내가 만든 코스) ---------- */
  function setMap(layout) {
    MAP = E.buildMap(layout);
    P = buildPaths();
    buildMini();
  }

  const Courses = (() => {
    let list = [], cur = 'default';
    const read = () => {
      const v = store.get('maps', []);
      return Array.isArray(v) ? v.filter((m) => m && m.id && Array.isArray(m.layout)) : [];
    };
    const write = () => store.set('maps', list);
    const find = (id) => list.find((m) => m.id === id);
    function render() {
      ui.course.replaceChildren();
      const add = (value, text) => {
        const o = document.createElement('option'); o.value = value; o.textContent = text; ui.course.append(o);
      };
      add('default', '기본 코스');
      for (const m of list) add(m.id, m.name);
      ui.course.value = find(cur) ? cur : 'default';
    }
    function select(id) {
      cur = find(id) ? id : 'default';
      setMap(cur === 'default' ? undefined : find(cur).layout);
      store.set('course', cur);
      render();
      if (S.phase === 'setup') { S.preview = []; syncPreview(); }
    }
    function upsert(id, name, layout) {
      const now = Date.now();
      let m = id && find(id);
      if (m) { m.name = name; m.layout = layout; m.updated = now; }
      else { m = { id: 'c' + now.toString(36) + (rand32() % 1000), name, layout, updated: now }; list.push(m); }
      write();
      return m.id;
    }
    function remove(id) { list = list.filter((m) => m.id !== id); write(); }
    function nextName() {
      let i = list.length + 1;
      while (list.some((m) => m.name === `내 코스 ${i}`)) i++;
      return `내 코스 ${i}`;
    }
    return {
      load(id) { list = read(); cur = id || store.get('course', 'default'); select(cur); },
      wire() {
        ui.course.addEventListener('change', () => select(ui.course.value));
        ui.editCourse.addEventListener('click', () => {
          if (cur === 'default') Editor.open(null, nextName(), E.defaultLayout(), '기본 코스를 복사했어요. 고친 뒤 저장하면 새 코스로 추가돼요.');
          else { const m = find(cur); Editor.open(m.id, m.name, m.layout); }
        });
        ui.newCourse.addEventListener('click', () => Editor.open(null, nextName(), []));
        ui.importOpen.addEventListener('click', () => {
          ui.importCode.value = ''; ui.importErr.hidden = true; ui.importBox.hidden = false;
          try { ui.importCode.focus(); } catch (e) { /* 무시 */ }
        });
        ui.importCancel.addEventListener('click', () => { ui.importBox.hidden = true; });
        ui.importOk.addEventListener('click', () => {
          const layout = E.decodeLayout(ui.importCode.value);
          if (!layout) {
            ui.importErr.textContent = '코드를 읽지 못했어요. PB1.로 시작하는 코드 전체를 붙여 넣었는지 확인해 주세요.';
            ui.importErr.hidden = false;
            return;
          }
          ui.importBox.hidden = true;
          Editor.open(null, '받은 코스', layout, '받은 코스예요. 둘러보고 저장하면 코스 목록에 추가돼요.');
        });
      },
      current: () => cur, select, upsert, remove, find, nextName,
    };
  })();

  /* ---------- 코스 편집기 ---------- */
  const Editor = (() => {
    const ED = {
      id: null, layout: [], tool: 'peg', sel: -1, hist: [], dirty: false, ptr: null,
      marks: [], exitArmed: false, delArmed: false, sliding: false,
    };
    const TOOL_HINT = {
      move: '<b>이동</b> · 놓인 것을 끌어서 옮기고, 빈 곳을 끌면 화면이 움직여요',
      peg: '<b>핀</b> · 누른 곳에 핀을 놓아요. 끌면 화면이 움직여요',
      bumper: '<b>범퍼</b> · 누른 곳에 범퍼를 놓아요. 닿은 구슬을 세게 튕겨요',
      rotor: '<b>풍차</b> · 누른 곳에 풍차를 놓아요. 놓은 뒤 날개·길이·회전을 바꿀 수 있어요',
      wall: '<b>벽</b> · 시작점에서 끝점까지 끌어서 그어요. 기울어 있어야 구슬이 굴러가요',
      erase: '<b>지우개</b> · 지울 것을 눌러요',
    };
    const snap = (v) => Math.round(v / 5) * 5;
    const box = () => MAP.edit;
    const clampX = (x) => clamp(x, 24, 496);
    const clampY = (y) => clamp(y, box().y0, box().y1);

    function world(e) {
      const r = field.getBoundingClientRect();
      return { x: (e.clientX - r.left - L.ox) / L.scale, y: S.camY + (e.clientY - r.top - L.focusY) / L.scale };
    }
    function segDist(px, py, ax, ay, bx, by) {
      const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
      const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
      return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
    }
    function hit(w) {
      const tol = 16 / L.scale;
      for (let i = ED.layout.length - 1; i >= 0; i--) {
        const it = ED.layout[i];
        if (it[0] === 'p' && Math.hypot(w.x - it[1], w.y - it[2]) < (it[3] || 6) + tol) return i;
        if (it[0] === 'b' && Math.hypot(w.x - it[1], w.y - it[2]) < it[3] + tol * 0.6) return i;
        if (it[0] === 'r' && Math.hypot(w.x - it[1], w.y - it[2]) < Math.max(22, tol * 1.4)) return i;
        if (it[0] === 'w' && segDist(w.x, w.y, it[1], it[2], it[3], it[4]) < 7 + tol * 0.7) return i;
      }
      return -1;
    }
    function snapshot() {
      ED.hist.push(JSON.stringify(ED.layout));
      if (ED.hist.length > 60) ED.hist.shift();
      ED.dirty = true; ED.exitArmed = false; ED.delArmed = false; ED.marks = [];
    }
    function apply() {
      ED.layout = E.cleanLayout(ED.layout);
      if (ED.sel >= ED.layout.length) ED.sel = -1;
      setMap(ED.layout);
      paint();
    }
    function msg(text, warn) {
      ui.edMsg.textContent = text || '';
      ui.edMsg.hidden = !text;
      ui.edMsg.classList.toggle('warn', !!warn);
    }
    function paint() {
      document.querySelectorAll('.tool[data-tool]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === ED.tool)));
      ui.edHint.innerHTML = TOOL_HINT[ED.tool];
      ui.edCount.textContent = `${ED.layout.length}/${E.MAX_ITEMS}`;
      ui.edUndo.disabled = !ED.hist.length;
      ui.edDelete.hidden = !ED.id;
      ui.edDelete.textContent = ED.delArmed ? '정말 삭제' : '코스 삭제';
      ui.edExit.textContent = ED.exitArmed ? '저장 안 하고 나가기' : '나가기';
      const it = ED.layout[ED.sel];
      ui.edInspect.hidden = !it;
      if (!it) return;
      const rot = it[0] === 'r', bum = it[0] === 'b';
      ui.insArms.hidden = !rot; ui.insLen.hidden = !rot; ui.insSpeed.hidden = !rot; ui.insSize.hidden = !bum;
      if (rot) {
        document.querySelectorAll('input[name="arms"]').forEach((r) => { r.checked = Number(r.value) === it[3]; });
        ui.rotLen.value = String(it[4]);
        ui.rotSpeed.value = String(it[5]);
        ui.rotSpeedVal.textContent = Math.abs(it[5]) < 0.05 ? '멈춤' : `${it[5] > 0 ? '시계' : '반시계'} ${Math.abs(it[5]).toFixed(1)}`;
      }
      if (bum) {
        const size = it[3] < 16 ? 12 : it[3] > 26 ? 30 : 22;
        document.querySelectorAll('input[name="bsize"]').forEach((r) => { r.checked = Number(r.value) === size; });
      }
    }
    function full() {
      if (ED.layout.length < E.MAX_ITEMS) return false;
      msg(`한 코스에 ${E.MAX_ITEMS}개까지 놓을 수 있어요.`, true);
      return true;
    }
    function place(w) {
      if (full()) return;
      const x = snap(clampX(w.x)), y = snap(clampY(w.y));
      snapshot();
      if (ED.tool === 'peg') ED.layout.push(['p', x, y]);
      else if (ED.tool === 'bumper') { ED.layout.push(['b', x, y, 22, 560]); ED.sel = ED.layout.length - 1; }
      else if (ED.tool === 'rotor') { ED.layout.push(['r', x, y, 4, 60, 2.4]); ED.sel = ED.layout.length - 1; }
      Sound.tick(2000);
      apply();
    }

    const api = {
      open(id, name, layout, note) {
        ED.id = id;
        ED.layout = E.cleanLayout(JSON.parse(JSON.stringify(layout)));
        ED.hist = []; ED.sel = -1; ED.marks = []; ED.ptr = null;
        ED.dirty = !id && ED.layout.length > 0;
        ED.exitArmed = false; ED.delArmed = false;
        ui.edName.value = name;
        ui.edShareBox.hidden = true;
        msg(note || (ED.layout.length ? '' : '빈 코스예요. 핀이나 벽을 놓아 길을 만들어 보세요.'));
        S.phase = 'edit';
        setMap(ED.layout);
        setPhaseUI();
        paint();
        S.camY = 640;
      },
      close() {
        S.phase = 'setup';
        Courses.select(Courses.current());
        setPhaseUI();
        S.camY = (S.topSlotY + MAP.gateY + 100) / 2;
      },
      down(e) {
        const w = world(e);
        ED.ptr = { id: e.pointerId, sx: e.clientX, sy: e.clientY, cam: S.camY, w, moved: false, mode: 'tap', idx: -1 };
        try { field.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
        if (ED.tool === 'move') {
          const i = hit(w);
          if (i >= 0) { ED.ptr.mode = 'drag'; ED.ptr.idx = i; ED.ptr.orig = ED.layout[i].slice(); ED.sel = i; paint(); }
          else ED.ptr.mode = 'pan';
        } else if (ED.tool === 'wall') {
          ED.ptr.mode = 'wall';
          ED.ptr.a = { x: snap(clampX(w.x)), y: snap(clampY(w.y)) };
          ED.ptr.b = ED.ptr.a;
        }
      },
      move(e) {
        const p = ED.ptr;
        if (!p || e.pointerId !== p.id) return;
        const dx = e.clientX - p.sx, dy = e.clientY - p.sy;
        if (!p.moved && Math.hypot(dx, dy) > 8) {
          p.moved = true;
          if (p.mode === 'drag') snapshot();
          if (p.mode === 'tap') p.mode = 'pan';
        }
        if (!p.moved) return;
        const w = world(e);
        if (p.mode === 'pan') S.camY = p.cam - dy / L.scale;
        else if (p.mode === 'wall') p.b = { x: snap(clampX(w.x)), y: snap(clampY(w.y)) };
        else if (p.mode === 'drag') {
          const it = ED.layout[p.idx], o = p.orig;
          const ddx = snap(w.x - p.w.x), ddy = snap(w.y - p.w.y);
          if (it[0] === 'w') {
            it[1] = clampX(o[1] + ddx); it[2] = clampY(o[2] + ddy);
            it[3] = clampX(o[3] + ddx); it[4] = clampY(o[4] + ddy);
          } else { it[1] = clampX(o[1] + ddx); it[2] = clampY(o[2] + ddy); }
          setMap(ED.layout);
        }
      },
      up(e) {
        const p = ED.ptr;
        if (!p || e.pointerId !== p.id) return;
        ED.ptr = null;
        if (p.mode === 'wall') {
          if (p.moved && Math.hypot(p.b.x - p.a.x, p.b.y - p.a.y) >= 16) {
            if (full()) return;
            snapshot();
            ED.layout.push(['w', p.a.x, p.a.y, p.b.x, p.b.y]);
            ED.sel = ED.layout.length - 1;
            apply();
          } else { ED.sel = hit(p.w); paint(); }
          return;
        }
        if (p.mode === 'drag') { apply(); return; }
        if (p.moved) return;
        if (p.mode === 'pan') { ED.sel = -1; paint(); return; }
        // 탭
        const i = hit(p.w);
        if (ED.tool === 'erase') {
          if (i >= 0) { snapshot(); ED.layout.splice(i, 1); ED.sel = -1; apply(); }
          return;
        }
        if (i >= 0 && ED.layout[i][0] !== 'p') { ED.sel = i; paint(); return; }
        place(p.w);
      },
      draw(y0, y1, t) {
        const b = box();
        fx.save();
        fx.setLineDash([10, 8]); fx.lineWidth = 2; fx.strokeStyle = rgba(C.dmd, 0.45);
        fx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
        fx.setLineDash([]);
        fx.fillStyle = rgba(C.ink, 0.08);
        const gy0 = Math.max(b.y0, Math.ceil(y0 / 40) * 40), gy1 = Math.min(b.y1, y1);
        for (let y = gy0; y <= gy1; y += 40) for (let x = 40; x <= 480; x += 40) fx.fillRect(x - 1, y - 1, 2, 2);
        const it = ED.layout[ED.sel];
        if (it) {
          if (it[0] === 'w') {
            fx.lineCap = 'round'; fx.lineWidth = 24; fx.strokeStyle = rgba(C.dmd, 0.3);
            fx.beginPath(); fx.moveTo(it[1], it[2]); fx.lineTo(it[3], it[4]); fx.stroke();
          } else {
            const r = it[0] === 'r' ? it[4] + 8 : it[0] === 'b' ? it[3] + 8 : (it[3] || 6) + 8;
            fx.strokeStyle = C.dmd; fx.lineWidth = 2.5; fx.setLineDash([6, 5]);
            circle(it[1], it[2], r); fx.stroke(); fx.setLineDash([]);
          }
        }
        const p = ED.ptr;
        if (p && p.mode === 'wall' && p.moved) {
          fx.lineCap = 'round'; fx.strokeStyle = rgba(C.ramp, 0.7); fx.lineWidth = 14;
          fx.beginPath(); fx.moveTo(p.a.x, p.a.y); fx.lineTo(p.b.x, p.b.y); fx.stroke();
        }
        fx.strokeStyle = C.insert; fx.lineWidth = 3;
        for (const m of ED.marks) {
          circle(m.x, m.y, 18 + Math.sin(t * 6) * 3); fx.stroke();
          fx.beginPath();
          fx.moveTo(m.x - 8, m.y - 8); fx.lineTo(m.x + 8, m.y + 8);
          fx.moveTo(m.x + 8, m.y - 8); fx.lineTo(m.x - 8, m.y + 8);
          fx.stroke();
        }
        fx.restore();
      },
      check() {
        msg('구슬 12개로 3판 굴려 보는 중…');
        ui.edCheck.disabled = true;
        setTimeout(() => {
          const map = E.buildMap(ED.layout);
          const entries = Array.from({ length: 12 }, (_, i) => ({ name: 'm' + i }));
          let total = 0;
          const stuck = [];
          for (let k = 0; k < 3; k++) {
            const race = new E.Race(map, entries, { seed: rand32(), skills: false, cats: false });
            race.release();
            while ((race.active.length || race.held.length) && race.time < E.TIME_LIMIT + 1) { race.step(); race.events.length = 0; }
            for (const m of race.finished) if (m.timedOut) stuck.push({ x: m.x, y: m.y });
            total += race.time;
          }
          setMap(ED.layout);
          ui.edCheck.disabled = false;
          ED.marks = stuck.slice(0, 12);
          const avg = Math.round(total / 3);
          if (stuck.length) msg('구슬이 갇히는 곳이 있어요 (빨간 표시). 그대로 두면 2분 뒤 남은 구슬은 결승선에 가까운 순서로 도착 처리돼요.', true);
          else if (avg > 70) msg(`모두 도착했지만 한 판이 길어요 (평균 ${avg}초). 벽을 더 기울이면 빨라져요.`, true);
          else msg(`구슬 12개로 3판 모두 잘 도착했어요 · 한 판 평균 ${avg}초`);
          if (ED.marks.length) S.camY = ED.marks[0].y;
        }, 30);
      },
      wire() {
        document.querySelectorAll('.tool[data-tool]').forEach((b) => b.addEventListener('click', () => {
          ED.tool = b.dataset.tool; ED.sel = -1; paint();
        }));
        ui.edUndo.addEventListener('click', () => {
          if (!ED.hist.length) return;
          ED.layout = JSON.parse(ED.hist.pop()); ED.sel = -1; ED.marks = [];
          apply();
        });
        document.querySelectorAll('input[name="arms"]').forEach((r) => r.addEventListener('change', () => {
          const it = ED.layout[ED.sel];
          if (!it || it[0] !== 'r') return;
          snapshot(); it[3] = Number(r.value); apply();
        }));
        const slide = (fn) => () => {
          const it = ED.layout[ED.sel];
          if (!it || it[0] !== 'r') return;
          if (!ED.sliding) { snapshot(); ED.sliding = true; }
          fn(it); setMap(ED.layout); paint();
        };
        ui.rotLen.addEventListener('input', slide((it) => { it[4] = Number(ui.rotLen.value); }));
        ui.rotSpeed.addEventListener('input', slide((it) => { it[5] = Number(ui.rotSpeed.value); }));
        [ui.rotLen, ui.rotSpeed].forEach((el) => el.addEventListener('change', () => { ED.sliding = false; apply(); }));
        document.querySelectorAll('input[name="bsize"]').forEach((r) => r.addEventListener('change', () => {
          const it = ED.layout[ED.sel];
          if (!it || it[0] !== 'b') return;
          snapshot();
          const size = Number(r.value);
          it[3] = size; it[4] = size < 16 ? 380 : size > 26 ? 640 : 560;
          apply();
        }));
        ui.insDelete.addEventListener('click', () => {
          if (ED.sel < 0) return;
          snapshot(); ED.layout.splice(ED.sel, 1); ED.sel = -1; apply();
        });
        ui.edCheck.addEventListener('click', api.check);
        ui.edShare.addEventListener('click', () => {
          ui.edCode.value = E.encodeLayout(ED.layout);
          ui.edShareBox.hidden = !ui.edShareBox.hidden;
          msg(ui.edShareBox.hidden ? '' : '이 코드를 보내면 받는 사람이 설정의 "공유 코드로 코스 불러오기"에서 열 수 있어요.');
        });
        ui.edCopy.addEventListener('click', () => {
          const txt = ui.edCode.value;
          const ok = () => { ui.edCopy.textContent = '복사했어요'; setTimeout(() => { ui.edCopy.textContent = '코드 복사'; }, 1500); };
          const fb = () => { ui.edCode.focus(); ui.edCode.select(); ui.edCopy.textContent = '선택된 코드를 복사하세요'; };
          try {
            const pr = navigator.clipboard && navigator.clipboard.writeText(txt);
            if (pr && pr.then) pr.then(ok, fb); else fb();
          } catch (e) { fb(); }
        });
        ui.edClear.addEventListener('click', () => {
          if (!ED.layout.length) return;
          snapshot(); ED.layout = []; ED.sel = -1; apply();
          msg('모두 지웠어요. 되돌리기로 살릴 수 있어요.');
        });
        ui.edSave.addEventListener('click', () => {
          const name = (ui.edName.value || '').trim() || Courses.nextName();
          const id = Courses.upsert(ED.id, name, E.cleanLayout(ED.layout));
          ED.id = id; ED.dirty = false;
          Courses.load(id);
          api.close();
        });
        ui.edExit.addEventListener('click', () => {
          if (ED.dirty && !ED.exitArmed) {
            ED.exitArmed = true; paint();
            msg('저장하지 않은 변경이 있어요. 한 번 더 누르면 저장하지 않고 나가요.', true);
            return;
          }
          api.close();
        });
        ui.edDelete.addEventListener('click', () => {
          if (!ED.id) return;
          if (!ED.delArmed) { ED.delArmed = true; paint(); msg('한 번 더 누르면 이 코스를 지워요.', true); return; }
          Courses.remove(ED.id);
          Courses.load('default');
          S.phase = 'setup';
          setPhaseUI();
        });
        ui.edName.addEventListener('input', () => { ED.dirty = true; ED.exitArmed = false; });
      },
    };
    return api;
  })();

  /* ---------- 매 프레임 ---------- */
  function updatePreview(dt) {
    const k = 1 - Math.exp(-dt * 12);
    for (const p of S.preview) {
      p.x += (p.tx - p.x) * k;
      if (p.y < p.ty || p.vy) {
        p.vy += 1800 * dt; p.y += p.vy * dt;
        if (p.y >= p.ty) { p.y = p.ty; p.vy = p.vy > 160 ? -p.vy * 0.32 : 0; }
      } else {
        p.y += (p.ty - p.y) * k;
      }
    }
  }

  function update(dt, now) {
    if (S.phase === 'edit') { for (const r of MAP.rotors) r.angle += r.omega * dt; }
    if (S.phase === 'setup') updatePreview(dt);
    else if (S.phase === 'countdown') updateCountdown(dt);
    else if (S.race) updateRace(dt, now);
    const decay = Math.exp(-dt * 5);
    for (const c of MAP.circs) if (c.flash) c.flash = c.flash > 0.01 ? c.flash * decay : 0;
    updateParticles(dt);
    updateCamera(dt, now);
    if (S.shakeT > 0) S.shakeT = Math.max(0, S.shakeT - dt);
    if (S.race && (S.phase === 'race' || S.phase === 'done')) {
      DMD.set(raceContent());
      if (now - S.lastUi > 200) { S.lastUi = now; renderBoard(); renderTicker(); }
      const left = S.shakeReady - now;
      ui.shakeCd.style.width = left > 0 ? (100 * left) / 1500 + '%' : '0%';
      const dis = S.phase !== 'race' || left > 0;
      if (ui.shake.disabled !== dis) ui.shake.disabled = dis;
    }
  }

  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    update(dt, now);
    render(now);
    requestAnimationFrame(frame);
  }

  /* ---------- 이벤트 연결 ---------- */
  function paintSound() {
    ui.sound.setAttribute('aria-pressed', String(S.sound));
    ui.soundLabel.textContent = S.sound ? '소리 켬' : '소리 끔';
    ui.sound.querySelector('.wave').toggleAttribute('hidden', !S.sound);
    ui.sound.querySelector('.mute').toggleAttribute('hidden', S.sound);
  }

  function wire() {
    ui.names.addEventListener('input', () => { syncPreview(); save(); });
    ui.names.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); startRace(); }
    });
    modeInputs.forEach((r) => r.addEventListener('change', () => {
      if (!r.checked) return;
      S.mode = r.value;
      ui.rankRow.hidden = S.mode !== 'rank';
      validate(); save();
      DMD.set(idleContent(), true);
    }));
    ui.rankNum.addEventListener('input', () => {
      S.rank = Math.max(1, parseInt(ui.rankNum.value, 10) || 1);
      validate(); save();
      DMD.set(idleContent(), true);
    });
    ui.start.addEventListener('click', startRace);
    ui.skills.addEventListener('change', () => { S.skills = ui.skills.checked; save(); });
    ui.cats.addEventListener('change', () => { S.cats = ui.cats.checked; save(); });

    ui.shake.addEventListener('click', () => {
      const now = performance.now();
      if (S.phase !== 'race' || !S.race || now < S.shakeReady) return;
      S.race.shake(1);
      S.shakeReady = now + 1500;
      if (!reduceMotion) S.shakeT = 0.35;
      Sound.shake();
    });
    ui.speed.addEventListener('click', () => {
      S.speed = S.speed === 1 ? 2 : 1;
      ui.speed.setAttribute('aria-pressed', String(S.speed === 2));
    });
    ui.sound.addEventListener('click', () => { S.sound = !S.sound; Sound.unlock(); paintSound(); save(); });
    ui.stop.addEventListener('click', goSetup);
    ui.again.addEventListener('click', () => {
      ui.result.hidden = true;
      const slots = E.spawnSlots(MAP, Math.max(1, S.preview.length));
      S.preview.forEach((p, i) => { p.x = slots[i].x; p.y = slots[i].y; p.vy = 0; });
      startRace();
    });
    ui.edit.addEventListener('click', () => { goSetup(); if (L.wide) ui.names.focus(); });
    ui.copy.addEventListener('click', () => {
      if (!S.winner) return;
      const txt = resultText();
      const ok = () => {
        ui.copy.textContent = '복사했어요';
        setTimeout(() => { ui.copy.textContent = '결과 복사'; }, 1600);
      };
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.className = 'copy-fallback'; ta.id = 'copyText'; ta.readOnly = true; ta.value = txt;
        ta.setAttribute('aria-label', '결과 글자');
        ui.copySlot.replaceChildren(ta);
        ta.focus(); ta.select();
        ui.copy.textContent = '선택된 글자를 복사하세요';
      };
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(txt);
        if (p && p.then) p.then(ok, fallback); else fallback();
      } catch (e) { fallback(); }
    });
    ui.ranks.addEventListener('toggle', renderResultList);
    ui.boardList.addEventListener('wheel', () => { ui.boardList._userScroll = performance.now() + 4000; }, { passive: true });
    ui.boardList.addEventListener('touchmove', () => { ui.boardList._userScroll = performance.now() + 4000; }, { passive: true });

    // 코스 끌어서 둘러보기
    let drag = null;
    field.addEventListener('pointerdown', (e) => {
      if (S.phase === 'edit') { Editor.down(e); return; }
      drag = { id: e.pointerId, y: e.clientY, cam: S.camY, moved: false };
      try { field.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    });
    field.addEventListener('pointermove', (e) => {
      if (S.phase === 'edit') { Editor.move(e); return; }
      if (!drag || e.pointerId !== drag.id) return;
      const dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dy) > 5) { drag.moved = true; field.classList.add('is-dragging'); }
      if (drag.moved) { S.camY = drag.cam - dy / L.scale; S.manualUntil = performance.now() + 6000; }
    });
    const endDrag = (e) => {
      if (S.phase === 'edit') { Editor.up(e); return; }
      if (drag && e.pointerId === drag.id) { drag = null; field.classList.remove('is-dragging'); }
    };
    field.addEventListener('pointerup', endDrag);
    field.addEventListener('pointercancel', endDrag);
    field.addEventListener('wheel', (e) => {
      e.preventDefault();
      S.camY += (e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY) / L.scale;
      S.manualUntil = performance.now() + 6000;
    }, { passive: false });

    let miniDrag = false;
    const miniJump = (e) => {
      const r = mini.getBoundingClientRect();
      S.camY = clamp((e.clientY - r.top) / r.height, 0, 1) * MAP.H;
      S.manualUntil = performance.now() + 6000;
    };
    mini.addEventListener('pointerdown', (e) => {
      miniDrag = true; miniJump(e);
      try { mini.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    });
    mini.addEventListener('pointermove', (e) => { if (miniDrag) miniJump(e); });
    mini.addEventListener('pointerup', () => { miniDrag = false; });
    mini.addEventListener('pointercancel', () => { miniDrag = false; });
    ui.follow.addEventListener('click', () => { S.manualUntil = 0; });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && (S.phase === 'race' || S.phase === 'countdown')) keepAwake(true);
    });

    Courses.wire();
    Editor.wire();
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => layout());
      ro.observe(app); ro.observe(ui.setup); ro.observe(ui.edPanel);
    } else {
      window.addEventListener('resize', layout);
    }

    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load(`20px ${FONT_DISPLAY}`, '핀볼 뽑기 당첨'),
        document.fonts.load(`600 12px ${FONT_BODY}`, '가나다 ABC'),
      ]).then(() => { labelSprites.clear(); DMD.invalidate(); }).catch(() => {});
    }

    try {
      const hot = window.claude && window.claude.hot;
      if (hot && hot.snapshot) hot.snapshot(() => ({ names: ui.names.value, mode: S.mode, rank: S.rank, sound: S.sound, skills: S.skills, cats: S.cats, course: Courses.current() }));
    } catch (e) { /* 미리보기 밖에서는 없음 */ }
  }

  function boot(data) {
    data = data || {};
    const names = typeof data.names === 'string' ? data.names : store.get('names', EXAMPLE);
    ui.names.value = typeof names === 'string' ? names : EXAMPLE;
    const mode = data.mode || store.get('mode', 'first');
    S.mode = ['first', 'last', 'rank'].includes(mode) ? mode : 'first';
    S.rank = Math.max(1, parseInt(data.rank || store.get('rank', 2), 10) || 2);
    const snd = data.sound != null ? data.sound : store.get('sound', true);
    S.sound = snd !== false;
    S.skills = (data.skills != null ? data.skills : store.get('skills', true)) !== false;
    ui.skills.checked = S.skills;
    S.cats = (data.cats != null ? data.cats : store.get('cats', true)) !== false;
    ui.cats.checked = S.cats;
    modeInputs.forEach((r) => { r.checked = r.value === S.mode; });
    ui.rankRow.hidden = S.mode !== 'rank';
    ui.rankNum.value = String(S.rank);
    paintSound();
    Courses.load(data.course);
    wire();
    layout();
    syncPreview();
    setPhaseUI();
    S.camY = (S.topSlotY + MAP.gateY + 100) / 2;
    requestAnimationFrame(frame);

  }

  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot);
  else boot(hot && hot.data ? hot.data : {});
})();

</script>
</body>
</html>
